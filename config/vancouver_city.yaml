# Vancouver (City) — built fresh from the Metro Vancouver PBF, clipped to the
# City of Vancouver admin boundary (admin_level 8, OSM relation Q24639).
# All three modes, service roads kept, junction-simplified routing graph.
name: vancouver_city
output_path: data/db
source:
  type: pbf
  pbf_path: data/maps/metro_vancouver.osm.pbf
boundary:
  path: data/boundaries/vancouver_city.geojson
clip: {predicate: intersects, keep_largest_component: true}
modes: [driving, walking, cycling]
options:
  build_graph: true
  simplify: true
  merge_segments: false
  process_speeds: true
  extract_restrictions: true
  calculate_costs: true
  h3_indexing: false
validation: {enabled: true, fail_on_error: false}
report: {enabled: true}
viz: {enabled: true, basemap: voyager}
