# Sample: build all three networks for Monaco (inside its official border) from the small
# extract in data/sample/.
# Run from the repo root:   duckosm build --config config/sample_monaco.yaml   (a few seconds)
# Writes ./monaco.duckdb. For every field, see config/template.yaml.
name: monaco
output_path: .

source:
  type: pbf
  pbf_path: data/sample/monaco.osm.pbf

boundary:                          # Monaco's land border: duckosm boundary --osm-id 2220322 --pbf data/sample/monaco.osm.pbf
  path: data/sample/monaco.geojson

modes:
  - driving
  - walking
  - cycling

osm_overrides: osm_overrides/osm_overrides.yaml   # local fixes for known OSM errors

options:
  building_faces: true             # main.building_faces: each wall of a building with its type (front, back, side, party, court), and the wall rules of the fixes file. docs/concepts/building-walls.md

validation:
  enabled: true
