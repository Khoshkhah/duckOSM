# Sweden driving network — full-country PBF build.
#
#   duckosm build --config config/sweden.yaml        # -> data/db/sweden.duckdb  (slow, once)
#
# This is the PARENT build: derive sub-areas cheaply by clipping it (source.type: duckdb),
# e.g. config/sodermalm.yaml. Clipped areas keep Sweden's exact edge_ids, so downstream
# projects that key on edge_id never re-match. See docs/design/pipeline_update_plan.md §2.1.

name: sweden                           # -> data/db/sweden.duckdb
output_path: data/db                   # a directory (-> data/db/<name>.duckdb)

# ---- SOURCE: build from the whole-country OSM extract --------------------------
source:
  type: pbf
  pbf_path: data/maps/sweden-latest.osm.pbf   # Geofabrik sweden-latest (~800 MB)

# ---- BOUNDARY: none — build the entire country --------------------------------
# With no boundary the component clean-up is skipped, so legitimately disconnected
# islands (e.g. Gotland — no road bridge) are kept rather than dropped.
boundary:
  path: null

# ---- MODES --------------------------------------------------------------------
modes:
  - driving
  # walking / cycling omitted to keep this DB driving-only (cycling is the largest network).
  # - walking
  # - cycling

# ---- BUILD OPTIONS ------------------------------------------------------------
options:
  build_graph: true
  h3_indexing: true
  h3_resolution: 15                    # fine endpoint cells (matches the sodermalm clip)
  simplify: true
  process_speeds: true
  extract_restrictions: true
  calculate_costs: true
  # Cap DuckDB memory so the spatial/H3 extensions + Python keep headroom on a ~23 GiB
  # machine; large intermediates spill to disk instead of OOM-ing. Tune to your RAM.
  memory_limit: "16GB"

# ---- VALIDATION ---------------------------------------------------------------
# A whole country is many weakly-connected components (islands, ferry-separated road
# networks), so the single-/stranded-component asserts DON'T apply here — they're for
# clipped areas. Leaving them on would fail the build on legitimate islands.
validation:
  enabled: true
  fail_on_error: true
  assert_single_component: false
  assert_no_stranded_named: false
  assert_edge_id_stable: false         # no fixture/parent baseline for a fresh country build

# ---- REPORT + VISUALIZATION ---------------------------------------------------
report:
  enabled: true                        # reports/sweden_<ts>.{md,html}
viz:
  enabled: false                       # skip the roadstyle map for a country-scale build

# ---- INPUT CACHING (downloads/boundary only; the network db always rebuilds) --
cache_dir: pbf
