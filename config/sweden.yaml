name: sweden
pbf_path: data/map/sweden-latest.osm.pbf
output_path: data/db
options:
  build_graph: true
  h3_indexing: true
  h3_resolution: 15
  simplify: true
  process_speeds: true
  extract_restrictions: true
  calculate_costs: true
  # Cap DuckDB memory so the spatial/H3 extensions and Python have headroom on a
  # 23 GiB machine; large intermediates spill to disk. Prevents OOM on the cycling
  # network (the largest). Raise/lower to match available RAM.
  memory_limit: "16GB"
modes:
  - driving
  # walking and cycling omitted to keep this DB driving-only.
  # - walking
  # - cycling
