name: sodermalm_new
output_path: data/db
source:
  type: pbf
  pbf_path: data/maps/sweden-latest.osm.pbf
boundary:
  path: data/boundaries/sodermalm.geojson
clip: {predicate: intersects, keep_largest_component: true}
modes: [driving]
options:
  build_graph: true
  simplify: true
  process_speeds: true
  extract_restrictions: true
  calculate_costs: true
  h3_indexing: false
validation: {enabled: true, fail_on_error: false}
report: {enabled: true}
viz: {enabled: true, basemap: voyager}
