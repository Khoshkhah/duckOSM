# Greater Stockholm driving network — Stockholms län / Stockholm County (admin_level 4,
# osm_id 54391), the whole REGION. PBF variant: built directly from the Sweden PBF clipped to
# the county boundary, instead of clipping data/db/sweden.duckdb (config/stockholm_county.yaml).
# Edge_ids are computed fresh from this clip (still the stable hash(osm_id, source, target)), so
# boundary-adjacent edges may differ from a sweden-clip; interior edges match.
#
#   duckosm build --config config/stockholm_county_pbf.yaml   # -> data/db/stockholm_county.duckdb

name: stockholm_county                 # -> data/db/stockholm_county.duckdb
output_path: data/db

source:
  type: pbf
  pbf_path: data/maps/sweden-latest.osm.pbf

boundary:
  path: data/boundaries/stockholm_county.geojson

clip:
  predicate: intersects                # keep whole boundary-crossing roads (bridges)...
  keep_largest_component: true         # ...then drop disconnected stubs -> one clean network
  min_component_edges: 1
  connectivity_rescue: true
  strongly_connected: false

modes:
  - driving

options:
  build_graph: true
  simplify: true
  process_speeds: true
  extract_restrictions: true
  calculate_costs: true
  h3_indexing: true
  h3_resolution: 15

validation:
  enabled: true
  fail_on_error: false                 # no parent baseline; keep the build resilient
  assert_single_component: true
  assert_no_stranded_named: true

report:
  enabled: true                        # reports/stockholm_county_<ts>.{md,html}
viz:
  enabled: false                       # county-scale; render on demand
