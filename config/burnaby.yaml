# Burnaby — built fresh from the Metro Vancouver PBF, clipped to the City of
# Burnaby admin boundary. Driving mode only (for the OSM<->DRA conflation demo).
name: burnaby
output_path: data/db
source:
  type: pbf
  pbf_path: data/maps/metro_vancouver.osm.pbf
boundary:
  path: data/boundaries/burnaby.geojson
clip: {predicate: intersects, keep_largest_component: true}
modes: [driving]
options:
  build_graph: true
  simplify: true
  merge_segments: false
  process_speeds: true
  extract_restrictions: true
  calculate_costs: true
  h3_indexing: false
validation: {enabled: true, fail_on_error: false}
report: {enabled: true}
viz: {enabled: false, basemap: voyager}
