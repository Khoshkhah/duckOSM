# Vancouver (City) + 300 m margin — built from the Metro Vancouver PBF, clipped to the City of
# Vancouver admin boundary buffered outward by 300 m. The margin ensures roadside sensors that sit
# just outside the city edge (bridge crossings, boundary arterials) still land on the network.
# Same options as vancouver_city.yaml; OSM overrides (config/osm_overrides.yaml) apply.
name: vancouver_city_300m
output_path: data/db
source:
  type: pbf
  pbf_path: data/maps/metro_vancouver.osm.pbf
boundary:
  path: data/boundaries/vancouver_city.geojson
  buffer_m: 300                       # native outward margin (metres); no pre-buffered file needed
clip: {predicate: intersects, keep_largest_component: true}
modes: [driving, walking, cycling]
options:
  build_graph: true
  simplify: true
  merge_segments: false
  process_speeds: true
  extract_restrictions: true
  calculate_costs: true
  h3_indexing: false
validation: {enabled: true, fail_on_error: false}
report: {enabled: true}
viz: {enabled: true, basemap: voyager}
