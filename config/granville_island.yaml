# Granville Island — a small dashboard/test area: the Granville Bridge deck and its on/off ramps
# stacked over the island's street grid, which concentrates the hard cases (divided carriageways,
# grade separation, ramps, alleyways) into one screen.
#
# The boundary is the REAL one: OSM relation 11670779 (boundary=administrative, natural=peninsula),
# assembled from its 5 member ways — 15.6 ha. Not a hand-drawn bbox.
#
# CLIPPED FROM the built vancouver_city db rather than re-parsed from the PBF: the clipper leaves
# `edge_id` (a content hash) unchanged, so this area is a stable view of its parent and every match
# result is directly comparable with the full-city run.
#
# The 250 m margin is deliberate, and matters more here than it would for a bbox: the island proper is
# only ~500 m across, the match stage buffers 105 m around each source edge's hourglass, and the
# Granville Bridge approaches — the most interesting geometry — land just off the island itself.
name: granville_island
output_path: data/db
source:
  type: duckdb
  source_db: data/db/vancouver_city.duckdb
boundary:
  path: data/boundaries/granville_island.geojson
  buffer_m: 250
clip: {predicate: intersects, keep_largest_component: false}
modes: [driving, walking, cycling]
options:
  build_graph: true
  simplify: true
  merge_segments: false
  process_speeds: true
  extract_restrictions: true
  calculate_costs: true
  h3_indexing: false
validation: {enabled: true, fail_on_error: false}
report: {enabled: true}
viz: {enabled: true, basemap: voyager}
