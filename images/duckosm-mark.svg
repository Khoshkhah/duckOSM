<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="100%" height="100%">
  <defs>
    <!-- Beak Gradient -->
    <linearGradient id="tBeakGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Route Line Gradients -->
    <linearGradient id="tCyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="tTealLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05DFD7"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>

    <linearGradient id="tGoldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>

    <linearGradient id="tGreenLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EED97"/>
      <stop offset="100%" stop-color="#06D6A0"/>
    </linearGradient>

    <filter id="tGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(-10, -20)">
    <!-- Golden DuckDB Beak -->
    <path d="M 315 115 L 408 130 C 415 131, 416 139, 409 144 L 320 165 Z" 
          fill="url(#tBeakGrad)" stroke="#FFA000" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="368" cy="134" r="2.8" fill="#B26A00"/>
    <path d="M 322 144 L 392 141" stroke="#FF8F00" stroke-width="2" stroke-linecap="round"/>

    <!-- Head & Neck Contour & Network -->
    <path d="M 245 70 L 285 98 L 315 115 L 295 160 L 235 140 Z" 
          fill="none" stroke="url(#tCyanLine)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 245 70 L 215 115 L 235 140 L 225 195" 
          fill="none" stroke="url(#tCyanLine)" stroke-width="4"/>
    <path d="M 295 160 L 285 220 L 225 195" 
          fill="none" stroke="url(#tTealLine)" stroke-width="4.5"/>

    <!-- Eye (Routing Waypoint) -->
    <circle cx="285" cy="98" r="9" fill="#0B0F19" stroke="#FFF" stroke-width="3"/>
    <circle cx="285" cy="98" r="4.5" fill="#00F2FE"/>

    <!-- Duck Body Outer Highway Arc -->
    <path d="M 225 195 L 155 230 L 115 280 L 175 325 L 255 320 L 325 275 L 340 210 L 285 220" 
          fill="none" stroke="url(#tTealLine)" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Golden Shortcut Line (DuckDB High-Performance Vector) -->
    <path d="M 115 280 L 195 255 L 275 265 L 340 210" 
          fill="none" stroke="url(#tGoldLine)" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="14 6" filter="url(#tGlow)"/>

    <!-- Internal Road Network Connections -->
    <path d="M 155 230 L 195 255 L 175 325" fill="none" stroke="url(#tGreenLine)" stroke-width="3.5"/>
    <path d="M 225 195 L 195 255 L 255 320" fill="none" stroke="url(#tCyanLine)" stroke-width="3.5"/>
    <path d="M 285 220 L 275 265 L 255 320" fill="none" stroke="url(#tGreenLine)" stroke-width="3.5"/>
    <path d="M 285 220 L 325 275" fill="none" stroke="url(#tCyanLine)" stroke-width="3.5"/>

    <!-- Tail Streamlines -->
    <path d="M 115 280 L 55 265 C 50 264, 52 258, 58 258 L 105 260" fill="none" stroke="url(#tCyanLine)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 100 290 L 42 285 C 38 284, 40 278, 46 279 L 95 287" fill="none" stroke="url(#tTealLine)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 92 306 L 60 312 C 56 312, 58 306, 63 304 L 115 312" fill="none" stroke="url(#tGreenLine)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Directional Navigation Arrows -->
    <polygon points="188,251 202,255 192,264" fill="#FFD54F"/>
    <polygon points="298,239 312,232 308,248" fill="#FFD54F"/>

    <!-- Network Graph Nodes -->
    <circle cx="245" cy="70" r="6" fill="#FFF" filter="url(#tGlow)"/>
    <circle cx="215" cy="115" r="5" fill="#00F2FE"/>
    <circle cx="235" cy="140" r="5" fill="#06D6A0"/>
    <circle cx="295" cy="160" r="6" fill="#00F2FE"/>
    <circle cx="225" cy="195" r="7" fill="#FFD54F" filter="url(#tGlow)"/>
    <circle cx="285" cy="220" r="7" fill="#00F2FE" filter="url(#tGlow)"/>
    <circle cx="340" cy="210" r="6" fill="#4EED97"/>
    <circle cx="155" cy="230" r="6" fill="#00F2FE"/>
    <circle cx="195" cy="255" r="8" fill="#FFC107" filter="url(#tGlow)"/>
    <circle cx="275" cy="265" r="7.5" fill="#FFD54F" filter="url(#tGlow)"/>
    <circle cx="325" cy="275" r="5.5" fill="#00F2FE"/>
    <circle cx="115" cy="280" r="7.5" fill="#06D6A0" filter="url(#tGlow)"/>
    <circle cx="175" cy="325" r="6" fill="#00F2FE"/>
    <circle cx="255" cy="320" r="6.5" fill="#4EED97"/>
  </g>
</svg>
