<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="iconBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A12"/>
    </radialGradient>

    <!-- Beak Gradient -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Route Line Gradients -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="tealLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05DFD7"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>

    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>

    <linearGradient id="greenLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EED97"/>
      <stop offset="100%" stop-color="#06D6A0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle / Rounded Rectangle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#iconBg)" stroke="#334155" stroke-width="2.5"/>
  <!-- Subtle inner neon rim -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#00F2FE" stroke-width="1.2" opacity="0.25"/>

  <!-- H3 Spatial Hexagonal Background Matrix -->
  <g opacity="0.07" stroke="#00F2FE" stroke-width="1.2" fill="none">
    <polygon points="256,60 306,31 356,60 356,118 306,147 256,118"/>
    <polygon points="156,118 206,89 256,118 256,176 206,205 156,176"/>
    <polygon points="256,176 306,147 356,176 356,234 306,263 256,234"/>
    <polygon points="356,118 406,89 456,118 456,176 406,205 356,176"/>
    <polygon points="156,234 206,205 256,234 256,292 206,321 156,292"/>
    <polygon points="256,292 306,263 356,292 356,350 306,379 256,350"/>
    <polygon points="56,176 106,147 156,176 156,234 106,263 56,234"/>
    <polygon points="56,292 106,263 156,292 156,350 106,379 56,350"/>
  </g>

  <!-- Ambient Light Behind Duck -->
  <circle cx="270" cy="240" r="140" fill="#00F2FE" opacity="0.05" filter="url(#intenseGlow)"/>

  <!-- The duckOSM Mascot: Network Routing Duck -->
  <g id="duck-mascot" transform="translate(10, -5)">
    <!-- Golden DuckDB Beak -->
    <path d="M 335 155 L 428 170 C 435 171, 436 179, 429 184 L 340 205 Z" 
          fill="url(#beakGrad)" stroke="#FFA000" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="388" cy="174" r="2.8" fill="#B26A00"/>
    <path d="M 342 184 L 412 181" stroke="#FF8F00" stroke-width="2" stroke-linecap="round"/>

    <!-- Head & Neck Contour & Network -->
    <path d="M 265 110 L 305 138 L 335 155 L 315 200 L 255 180 Z" 
          fill="none" stroke="url(#cyanLine)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 265 110 L 235 155 L 255 180 L 245 235" 
          fill="none" stroke="url(#cyanLine)" stroke-width="4"/>
    <path d="M 315 200 L 305 260 L 245 235" 
          fill="none" stroke="url(#tealLine)" stroke-width="4.5"/>

    <!-- Eye (Routing Waypoint) -->
    <circle cx="305" cy="138" r="9" fill="#0B0F19" stroke="#FFF" stroke-width="3"/>
    <circle cx="305" cy="138" r="4.5" fill="#00F2FE"/>

    <!-- Duck Body Outer Highway Arc -->
    <path d="M 245 235 L 175 270 L 135 320 L 195 365 L 275 360 L 345 315 L 360 250 L 305 260" 
          fill="none" stroke="url(#tealLine)" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Golden Shortcut Line (DuckDB High-Performance Vector) -->
    <path d="M 135 320 L 215 295 L 295 305 L 360 250" 
          fill="none" stroke="url(#goldLine)" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="14 6" filter="url(#softGlow)"/>

    <!-- Internal Road Network Connections -->
    <path d="M 175 270 L 215 295 L 195 365" fill="none" stroke="url(#greenLine)" stroke-width="3.5"/>
    <path d="M 245 235 L 215 295 L 275 360" fill="none" stroke="url(#cyanLine)" stroke-width="3.5"/>
    <path d="M 305 260 L 295 305 L 275 360" fill="none" stroke="url(#greenLine)" stroke-width="3.5"/>
    <path d="M 305 260 L 345 315" fill="none" stroke="url(#cyanLine)" stroke-width="3.5"/>

    <!-- Tail Streamlines -->
    <path d="M 135 320 L 75 305 C 70 304, 72 298, 78 298 L 125 300" fill="none" stroke="url(#cyanLine)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 120 330 L 62 325 C 58 324, 60 318, 66 319 L 115 327" fill="none" stroke="url(#tealLine)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 112 346 L 80 352 C 76 352, 78 346, 83 344 L 135 352" fill="none" stroke="url(#greenLine)" stroke-width="3" stroke-linecap="round"/>

    <!-- Directional Navigation Arrows -->
    <polygon points="208,291 222,295 212,304" fill="#FFD54F"/>
    <polygon points="318,279 332,272 328,288" fill="#FFD54F"/>

    <!-- Network Graph Nodes (Pulsing Waypoint Intersections) -->
    <circle cx="265" cy="110" r="6" fill="#FFF" filter="url(#softGlow)"/>
    <circle cx="235" cy="155" r="5" fill="#00F2FE"/>
    <circle cx="255" cy="180" r="5" fill="#06D6A0"/>
    <circle cx="315" cy="200" r="6" fill="#00F2FE"/>
    <circle cx="245" cy="235" r="7" fill="#FFD54F" filter="url(#softGlow)"/>
    <circle cx="305" cy="260" r="7" fill="#00F2FE" filter="url(#softGlow)"/>
    <circle cx="360" cy="250" r="6" fill="#4EED97"/>
    <circle cx="175" cy="270" r="6" fill="#00F2FE"/>
    <circle cx="215" cy="295" r="8" fill="#FFC107" filter="url(#softGlow)"/>
    <circle cx="295" cy="305" r="7.5" fill="#FFD54F" filter="url(#softGlow)"/>
    <circle cx="345" cy="315" r="5.5" fill="#00F2FE"/>
    <circle cx="135" cy="320" r="7.5" fill="#06D6A0" filter="url(#softGlow)"/>
    <circle cx="195" cy="365" r="6" fill="#00F2FE"/>
    <circle cx="275" cy="360" r="6.5" fill="#4EED97"/>
  </g>

  <!-- Bottom Brand Mark: duckOSM -->
  <g transform="translate(256, 442)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">
      <tspan fill="#F8FAFC">duck</tspan>
      <tspan fill="url(#cyanLine)">OSM</tspan>
    </text>
  </g>
</svg>
