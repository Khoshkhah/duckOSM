name: Nightly wheel

# The Linux x86_64 wheel of the newest code, for a test in Colab or another Linux Python before a release. It is the
# only file of the GitHub pre-release "nightly", and each run replaces it. A merge to main that changes the package
# runs it; a run by hand (workflow_dispatch) can take any branch, to test a pull request in Colab.
# The version is <the version of pyproject.toml>.dev<the run number>, so pip does not take it for the PyPI release.
# In Colab, before the install cell of a notebook:
#   !pip install -q "duckosm[all] @ $(curl -s https://api.github.com/repos/Khoshkhah/duckOSM/releases/tags/nightly | grep -o 'https://[^"]*\.whl' | head -1)"
on:
  push:
    branches: [main]
    paths: [".github/workflows/nightly.yml", "pyproject.toml", "rust/**", "src/duckosm/**"]
  workflow_dispatch:

# one run at a time: two runs must not replace the wheel at the same time
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set the version <version>.dev<run number>
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          sed -i "0,/^version = \"$v\"/s//version = \"$v.dev${{ github.run_number }}\"/" pyproject.toml
          sed -i "s/^__version__ = \"$v\"/__version__ = \"$v.dev${{ github.run_number }}\"/" src/duckosm/__init__.py
          grep -m1 '^version' pyproject.toml && grep '^__version__' src/duckosm/__init__.py
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist
          manylinux: "2_28"
      - name: Test the wheel in a new virtual environment (the Rust module and a build of the Monaco sample)
        run: |
          python -m venv test-env && source test-env/bin/activate
          pip install dist/*.whl
          cd tests && python -c "import duckosm, duckosm._rust; print(duckosm.__file__)"
          cd .. && duckosm build --pbf tests/data/monaco_sample.osm.pbf --output build-test/monaco.duckdb --modes driving --no-features
      - name: Replace the wheel of the pre-release "nightly"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f nightly "$GITHUB_SHA" && git push -f origin nightly
          notes="The Linux x86_64 wheel of ${GITHUB_REF_NAME} at ${GITHUB_SHA::7} (run ${{ github.run_number }}). For tests only: the releases for users are on PyPI."
          if gh release view nightly >/dev/null 2>&1; then
            gh release view nightly --json assets -q '.assets[].name' | while read -r a; do gh release delete-asset nightly "$a" -y; done
            gh release edit nightly --prerelease --title "Nightly wheel" --notes "$notes"
          else
            gh release create nightly --prerelease --title "Nightly wheel" --notes "$notes"
          fi
          gh release upload nightly dist/*.whl
