name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # a hung test must not hold the runner for GitHub's 6 hours
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # GDAL (ogr2ogr) and osmium: duckosm boundary / clip-pbf and the sample build's pre-clip.
      - run: sudo apt-get update -q && sudo apt-get install -y -q gdal-bin osmium-tool
      # Tests that need local PBFs / built dbs / netconvert skip themselves.
      # [sumo] brings netconvert, so the SUMO export is tested for real
      - run: pip install -e ".[dev,routing,sumo]"
      # python -m pytest puts the repo root on the path: tests import each other as `tests.test_gmns`
      - run: python -m pytest tests/ -q -rs
      # the fixes editor of the page (web/fixes_editor/, docs/design/fixes_editor.md): its unit tests need only Node (on the runner)
      - run: node web/fixes_editor/fixes_units.mjs

  # The Rust engine (rust/, docs/design/rust_engine_move.md): the golden tests of the crates. One invocation compiles DuckDB one time.
  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # duckosm-edit too: the CLI and the wheel link it, so the golden tests run with the features that it adds (roadstyle's serde_json)
      - run: cargo test --release -p duckosm-core -p duckosm-duckdb -p duckosm-parquet -p duckosm-build -p duckosm-edit --features duckosm-edit/duckdb
        working-directory: rust

  # duckosm edit in a browser (tests/test_edit_page.py, docs/design/edit_page.md): the page of a Monaco build, a change, the box, Build again
  edit-page:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - run: pip install -e ".[dev]" "playwright==1.55.0"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_edit_page.py -q -rs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
