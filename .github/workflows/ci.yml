name: CI

on:
  push:
    branches: [main]
  pull_request:

# a new commit on a branch stops the run of its old commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # code: false when a pull request changes only the docs (docs/, README.md, CHANGELOG.md, mkdocs.yml). Then the jobs of the code show
  # as skipped, and the job docs is the check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      notebooks: ${{ steps.diff.outputs.notebooks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; echo notebooks=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          echo "$files"
          if echo "$files" | grep -vE '^(docs/|README\.md$|CHANGELOG\.md$|mkdocs\.yml$)' | grep -q .; then code=true; else code=false; fi
          echo code=$code >> "$GITHUB_OUTPUT"
          # the notebooks run on a change of the code or of a notebook
          if [ $code = true ] || echo "$files" | grep -q '^docs/notebooks/'; then echo notebooks=true; else echo notebooks=false; fi >> "$GITHUB_OUTPUT"

  # the docs site, as docs.yml builds it for Pages
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # MkDocs 2.0 drops the plugin/theme system Material depends on: stay on 1.x
      - run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10" "mkdocs-llmstxt>=0.5,<0.6" "nbconvert>=7,<8"
      # the pages of the notebooks (docs/notebooks/index.md links them): Markdown with the saved outputs
      - run: python scripts/notebook_pages.py
      - run: mkdocs build --strict

  # the demo notebooks of the manual (docs/notebooks/): each cell must run on Monaco. The map tests (live, link, picture,
  # plot) run here: this job has roadstyle. The run saves the notebooks with their outputs as the artifact "notebooks".
  notebooks:
    needs: changes
    if: needs.changes.outputs.notebooks == 'true'
    runs-on: ubuntu-24.04    # Playwright 1.55 has no Chromium for ubuntu-latest (26.04)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # only main saves: the store has 10 GB, and the caches of pull requests pushed out main's (each about 0.9 GB)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # torch for CPU first (the default wheel brings CUDA, about 2.5 GB); then the extras of the install cells ([sim]
      # brings netconvert, [ml] torch_geometric); osmnx: notebook 9 (to_osmnx); momepy, mapclassify: notebook 9 (city blocks)
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[widget,viz,graph,sim,gis,planning,hdmap,analysis,ml]" osmnx momepy mapclassify folium lonboard ortools pandana movingpandas lanelet2 pytest nbmake "playwright==1.55.0"
      # show="picture" takes a PNG of the live map in headless Chromium
      - run: python -m playwright install --with-deps chromium
      # the notebooks get Monaco with duckosm get. The runners often cannot reach Geofabrik ("Network is unreachable" on
      # all its addresses), so this step puts a list of extracts with only Monaco, and the Monaco extract of the repository
      # (tests/data/monaco.osm.pbf), in the cache of duckosm get (~/.cache/duckosm): get finds both and downloads nothing
      # from Geofabrik. The boundary still comes from Nominatim.
      - name: Put the Monaco extract in the cache of duckosm get
        run: |
          c=~/.cache/duckosm && mkdir -p $c/geofabrik/europe
          cp tests/data/monaco.osm.pbf $c/geofabrik/europe/monaco-latest.osm.pbf
          python - <<'PY'
          import json, os
          w, s, e, n = 7.38, 43.70, 7.47, 43.77                    # a box around Monaco
          ring = [[w, s], [e, s], [e, n], [w, n], [w, s]]
          index = {"type": "FeatureCollection", "features": [{"type": "Feature", "geometry": {"type": "Polygon", "coordinates": [ring]},
                   "properties": {"id": "monaco", "name": "Monaco", "urls": {"pbf": "https://download.geofabrik.de/europe/monaco-latest.osm.pbf"}}}]}
          json.dump(index, open(os.path.expanduser("~/.cache/duckosm/index-v1.json"), "w"))
          PY
      - run: python -m pytest tests/test_network.py -q -rs -k "map or plot"
      # the saved outputs of the manual: each notebook with its outputs, maps as plot pictures (not 6 MB of HTML);
      # commit them from the artifact "notebooks"
      - run: python -m pytest --nbmake --overwrite docs/notebooks/ -q
        env:
          DUCKOSM_MAP_SHOW: plot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebooks
          path: docs/notebooks/[0-9]*.ipynb

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60      # a hung test must not hold the runner for GitHub's 6 hours (the module compiles DuckDB)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # no GDAL and no osmium: duckosm boundary, clip-pbf, admin and export-gis are in Rust (sumo_compare's test skips)
      # Tests that need local PBFs / built dbs / netconvert skip themselves.
      # [sumo] brings netconvert, so the SUMO export is tested for real
      # hdmap: commonroad-io reads the CommonRoad map back; osmnx: tests/test_analysis.py compares with it
      - run: pip install -e ".[dev,networkx,sumo,hdmap,analysis]" osmnx
      # python -m pytest puts the repo root on the path: tests import each other as `tests.test_gmns`
      - run: python -m pytest tests/ -q -rs
      # the fixes editor of the page (web/fixes_editor/, docs/design/fixes_editor.md): its unit tests need only Node (on the runner)
      - run: node web/fixes_editor/fixes_units.mjs
      # the Ground step (web/ground_step/, docs/design/ground_step.md)
      - run: node web/ground_step/ground_units.mjs
      # the build steps of `duckosm studio` (web/build_steps/): the logic of the Area, OSM data, Settings and Build steps
      - run: node web/build_steps/steps_units.mjs

  # The Rust engine (rust/, docs/design/rust_engine_move.md): the golden tests of the crates. One invocation compiles DuckDB one time.
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    # the time of this job was the link of each test binary with thin LTO (about 50 binaries, each with the bundled DuckDB):
    # 35 min of the build. The tests do not need LTO; opt-level 3 stays, so the tests run as fast as before.
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # only main saves: the store has 10 GB, and the caches of pull requests pushed out main's (each about 0.9 GB)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # the router has no DuckDB and no threads: it builds for the pages too (WebAssembly; the planner page of route-map runs duckosm-planner)
      - run: cargo check --release -p duckosm-router -p duckosm-planner --target wasm32-unknown-unknown
        working-directory: rust
      # osmium: sumo_compare's .pbf (a developer tool, not a duckosm command)
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      # netconvert for the GMNS export (gmns_sumo): the version that made tests/data/exports/monaco_gmns_columns.tsv
      - run: python3 -m pip install --user -q eclipse-sumo==1.27.0 && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # duckosm-edit too: the CLI and the wheel link it, so the golden tests run with the features that it adds (roadstyle's serde_json)
      - run: cargo test --release -p duckosm-core -p duckosm-duckdb -p duckosm-parquet -p duckosm-build -p duckosm-edit -p duckosm-export -p duckosm-tools -p duckosm-route -p duckosm-router -p duckosm-planner --features duckosm-edit/duckdb,duckosm-route/petgraph
        working-directory: rust

  # duckosm viz and route-map in a browser (tests/test_route_map_rust.py, group F of docs/design/all_in_rust.md): the planner page routes
  # as route-points and directions on Monaco, walk + drive, and the pages at 390 x 844
  maps-page:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # ubuntu-24.04, not ubuntu-latest: Playwright 1.55 has no Chromium for ubuntu-latest (26.04) (2026-11-11)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # only main saves: the store has 10 GB, and the caches of pull requests pushed out main's (each about 0.9 GB)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # the program, with the planner's WebAssembly in it (duckosm-edit's build.rs)
      - run: cargo build --release -p duckosm-cli
        working-directory: rust
      - run: pip install pytest "duckdb<2" "playwright==1.55.0"   # tests/conftest.py installs the spatial extension
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_route_map_rust.py -q -rs

  # duckosm edit in a browser (tests/test_edit_page.py, docs/design/edit_page.md): the page of a Monaco build, a change, the box, Build again
  edit-page:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # ubuntu-24.04, not ubuntu-latest: Playwright 1.55 has no Chromium for ubuntu-latest (26.04) (2026-11-11)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # only main saves: the store has 10 GB, and the caches of pull requests pushed out main's (each about 0.9 GB)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pip install -e ".[dev]" "playwright==1.55.0"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_edit_page.py tests/test_editor_host_shapes.py tests/test_editor_building.py tests/test_editor_road_node.py tests/test_editor_turn_changes.py -q -rs

  # duckosm studio in a browser (tests/test_studio_page.py, docs/guides/studio.md): the six steps on Monaco, at a desktop width and at 390 x 844
  studio-page:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # ubuntu-24.04, not ubuntu-latest: Playwright 1.55 has no Chromium for ubuntu-latest (26.04) (2026-11-11)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # only main saves: the store has 10 GB, and the caches of pull requests pushed out main's (each about 0.9 GB)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      # card 8 (Edit levels): the level editor's WebAssembly package, built into the module before pip builds it (rust/duckosm-edit/editor_pkg.sh)
      - run: rustup target add wasm32-unknown-unknown && bash rust/duckosm-edit/editor_pkg.sh
      # [elevation]: the DEM of the Ground step is sampled by rasterio
      - run: pip install -e ".[dev,elevation]" "playwright==1.55.0"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_studio_page.py -q -rs

  package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
