name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "book/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The look of rustgis.app: Zensical builds the site from mkdocs.yml. The ci job "docs" still checks the links with
      # mkdocs --strict. Zensical does not read exclude_docs, so the developer documents are removed first.
      - run: pip install "zensical==0.0.67" "nbconvert>=7,<8"
      # Zensical has no notebook plugin: the notebooks become Markdown pages, with their saved outputs
      - run: python scripts/notebook_pages.py
      - run: rm -rf docs/design docs/rust docs/proposals docs/development.md docs/lane_map.md
      - run: zensical build
      # the notebook book (book/, Quarto): its chapters come from docs/notebooks with their saved outputs; it goes to
      # site/book/, next to the manual. Quarto needs no Jupyter kernel here (execute: enabled: false).
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - run: python book/make_book.py
      - run: quarto render book
      - run: cp -r book/_book site/book
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
