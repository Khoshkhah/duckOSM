site_name: duckOSM
site_description: OpenStreetMap to a routable road network in one DuckDB file, with edge IDs that survive every rebuild, clip and export.
site_url: https://khoshkhah.github.io/duckOSM/
repo_url: https://github.com/Khoshkhah/duckOSM
repo_name: Khoshkhah/duckOSM
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/duckosm-mark-inverse.svg   # the header is dark: yellow disc reads, the dark one doesn't
  favicon: assets/duckosm-mark.svg
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # GitHub-style anchors, so the docs' existing in-page links work on the site too
      slugify: !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }

# design notes and unbuilt specs stay in the repo but aren't published
exclude_docs: |
  design/
  lane_map.md

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Your first network: first_network.md
  - Guides:
      - User manual: user_manual.md
      - Query cookbook: query_cookbook.md
      - Admin boundaries: admin_boundaries.md
      - Routing across modes: multimodal.md
      - Elevation: elevation.md
  - Exports:
      - GeoPackage / shapefile: gis_export.md
      - MATSim network: matsim_export.md
      - MATSim lanes & signals: matsim_lanes_signals.md
      - GMNS: gmns_export.md
      - GMNS meso: gmns_meso.md
      - GMNS micro: gmns_micro.md
      - GMNS viewer: gmns_viewer.md
      - GMNS maps: gmns_map.md
      - GMNS map realism: gmns_map_realism.md
      - GMNS extras: gmns_roundout.md
      - Experimental:
          - OpenDRIVE: opendrive_export.md
          - Lanelet2: lanelet2_export.md
          - railML: railml_export.md
          - Lane routing: lane_routing.md
  - Concepts:
      - Architecture: architecture.md
      - Pipeline: pipeline.md
      - Driving, walking, cycling: multi_mode.md
      - Segment merging: merging.md
      - Global junctions: global_junction_segmentation.md
      - Connectivity repair: connectivity_repair.md
      - duckOSM and OSMnx: osmnx_comparison.md
  - Reference:
      - Configuration: configuration.md
      - Data dictionary: data_dictionary.md
      - Base-map features: features_schema.md
  - Development:
      - Development: development.md
