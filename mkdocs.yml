site_name: duckOSM
site_description: OpenStreetMap to a routable road network in one DuckDB file, with edge IDs that survive every rebuild, clip and export.
site_url: https://khoshkhah.github.io/duckOSM/
repo_url: https://github.com/Khoshkhah/duckOSM
repo_name: Khoshkhah/duckOSM
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/duckosm-mark-inverse.svg   # the header is dark: yellow disc reads, the dark one doesn't
  favicon: assets/duckosm-mark.svg
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/fullscreen.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # GitHub-style anchors, so the docs' existing in-page links work on the site too
      slugify: !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }

# design notes and unbuilt specs stay in the repo but aren't published
exclude_docs: |
  design/
  lane_map.md

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Your first network: first_network.md
  - Guides:
      - Prepare an area: guides/prepare-area.md
      - Build a network: guides/build.md
      - Fix OSM errors: guides/fix-osm-errors.md
      - Query the database: guides/query.md
      - Draw a map: guides/draw-map.md
      - Route: guides/route.md
      - Add elevation: guides/elevation.md
      - Add administrative boundaries: guides/admin-boundaries.md
      - Check a build: guides/check-build.md
  - Exports:
      - Overview: exports/index.md
      - SUMO: exports/sumo.md
      - MATSim: exports/matsim.md
      - GMNS: exports/gmns.md
      - GeoPackage / shapefile: exports/gis.md
      - networkx: exports/networkx.md
      - Experimental:
          - OpenDRIVE: exports/opendrive.md
          - Lanelet2: exports/lanelet2.md
          - railML: exports/railml.md
          - Lane-level routing: exports/lane-routing.md
  - Concepts:
      - Architecture: architecture.md
      - Pipeline: pipeline.md
      - Driving, walking, cycling: multi_mode.md
      - Segment merging: merging.md
      - Global junctions: global_junction_segmentation.md
      - Connectivity repair: connectivity_repair.md
      - duckOSM and OSMnx: osmnx_comparison.md
      - Routing across modes: multimodal.md
  - Reference:
      - Configuration: configuration.md
      - Data dictionary: data_dictionary.md
      - Base-map features: features_schema.md
      - Elevation sources: elevation.md
  - Development:
      - Development: development.md
