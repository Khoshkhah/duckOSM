site_name: duckOSM
site_description: OpenStreetMap to a routable road network in one DuckDB file, with edge IDs that survive every rebuild, clip and export.
site_url: https://khoshkhah.github.io/duckOSM/
repo_url: https://github.com/Khoshkhah/duckOSM
repo_name: Khoshkhah/duckOSM

theme:
  name: material
  logo: assets/duckosm-mark-inverse.svg   # the header is dark: yellow disc reads, the dark one doesn't
  favicon: assets/duckosm-mark.svg
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/fullscreen.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # GitHub-style anchors, so the docs' existing in-page links work on the site too
      slugify: !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }

# design notes and unbuilt specs stay in the repo but aren't published
plugins:
  - search
  # /llms.txt (an index for AI agents, llmstxt.org) and /llms-full.txt (every page as Markdown)
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >
        duckOSM turns OpenStreetMap data into routable road networks (driving, walking, cycling) in
        one DuckDB file, with stable edge ids, legal turns, and exports to SUMO, MATSim, GMNS and more.
        An agent skill with the essentials: https://github.com/Khoshkhah/duckOSM/blob/main/skills/duckosm/SKILL.md
      sections:
        Get started:
          - index.md
          - install.md
          - first_network.md
        Guides:
          - guides/prepare-area.md
          - guides/build.md
          - guides/fix-osm-errors.md
          - guides/query.md
          - guides/draw-map.md
          - guides/drawing-order.md
          - guides/route.md
          - guides/elevation.md
          - guides/admin-boundaries.md
          - guides/check-build.md
        Exports:
          - exports/index.md
          - exports/sumo.md
          - exports/matsim.md
          - exports/gmns.md
          - exports/gmns_tables.md
          - exports/gis.md
          - exports/networkx.md
          - exports/opendrive.md
          - exports/lanelet2.md
          - exports/railml.md
          - exports/lane-routing.md
        Concepts:
          - concepts/build.md
          - concepts/edge-ids.md
          - concepts/networks.md
          - concepts/cleanup.md
          - concepts/multimodal.md
          - concepts/osmnx.md
        Reference:
          - reference/cli.md
          - reference/configuration.md
          - reference/database.md
          - reference/features.md
          - reference/elevation-sources.md
        Development:
          - development.md

exclude_docs: |
  design/
  lane_map.md

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Your first network: first_network.md
  - Guides:
      - Prepare an area: guides/prepare-area.md
      - Build a network: guides/build.md
      - Fix OSM errors: guides/fix-osm-errors.md
      - Query the database: guides/query.md
      - Draw a map: guides/draw-map.md
      - Store the drawing order: guides/drawing-order.md
      - Route: guides/route.md
      - Walking: guides/walking.md
      - Add elevation: guides/elevation.md
      - Add administrative boundaries: guides/admin-boundaries.md
      - Check a build: guides/check-build.md
  - Exports:
      - Overview: exports/index.md
      - SUMO: exports/sumo.md
      - MATSim: exports/matsim.md
      - GMNS: exports/gmns.md
      - GMNS tables: exports/gmns_tables.md
      - GeoPackage / shapefile: exports/gis.md
      - networkx: exports/networkx.md
      - Experimental:
          - OpenDRIVE: exports/opendrive.md
          - Lanelet2: exports/lanelet2.md
          - railML: exports/railml.md
          - Lane-level routing: exports/lane-routing.md
  - Concepts:
      - How a build works: concepts/build.md
      - Stable edge ids: concepts/edge-ids.md
      - What each network contains: concepts/networks.md
      - Network clean-up: concepts/cleanup.md
      - Routing across modes: concepts/multimodal.md
      - duckOSM and OSMnx: concepts/osmnx.md
  - Reference:
      - Command line: reference/cli.md
      - Configuration: reference/configuration.md
      - Database schema: reference/database.md
      - Base-map layers: reference/features.md
      - Elevation sources: reference/elevation-sources.md
  - Development:
      - Development: development.md
