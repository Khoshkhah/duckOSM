site_name: duckOSM
site_description: OpenStreetMap to a routable road network in one DuckDB file, with edge IDs that survive every rebuild, clip and export.
site_url: https://khoshkhah.github.io/duckOSM/
repo_url: https://github.com/Khoshkhah/duckOSM
repo_name: Khoshkhah/duckOSM

theme:
  name: material
  logo: assets/duckosm-mark-inverse.svg   # the header is dark: yellow disc reads, the dark one doesn't
  favicon: assets/duckosm-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  # the look of rustgis.app (built with Zensical, .github/workflows/docs.yml): no top tabs, the chapters at the left
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.footer
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share

extra_css:
  - assets/extra.css
  - stylesheets/portal.css

extra_javascript:
  - assets/fullscreen.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # GitHub-style anchors, so the docs' existing in-page links work on the site too
      slugify: !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }

# design notes, unbuilt specs and the developer guide stay in the repo but aren't published
plugins:
  - search
  # /llms.txt (an index for AI agents, llmstxt.org) and /llms-full.txt (every page as Markdown)
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >
        duckOSM turns OpenStreetMap data into routable road networks (driving, walking, cycling) in
        one DuckDB file, with stable edge ids, legal turns, and exports to SUMO, MATSim, GMNS and more.
        An agent skill with the essentials: https://github.com/Khoshkhah/duckOSM/blob/main/skills/duckosm/SKILL.md
      sections:
        Get started:
          - index.md
          - install.md
          - first_network.md
        Guides:
          - guides/prepare-area.md
          - guides/build.md
          - guides/studio.md
          - guides/edit-osm-data.md
          - guides/query.md
          - guides/ask-questions.md
          - guides/draw-map.md
          - guides/drawing-order.md
          - guides/route.md
          - guides/elevation.md
          - guides/admin-boundaries.md
          - guides/check-build.md
        Exports:
          - exports/index.md
          - exports/osm-file.md
          - exports/sumo.md
          - exports/matsim.md
          - exports/gmns.md
          - exports/gmns_tables.md
          - exports/gis.md
          - exports/networkx.md
          - exports/opendrive.md
          - exports/lanelet2.md
          - exports/railml.md
          - exports/lane-routing.md
        Concepts:
          - concepts/build.md
          - concepts/terrain.md
          - concepts/edge-ids.md
          - concepts/networks.md
          - concepts/cleanup.md
          - concepts/multimodal.md
          - concepts/osmnx.md
          - concepts/quackosm.md
          - concepts/gdal.md
          - exports/geofabrik.md
        Reference:
          - reference/cli.md
          - reference/boundary.md
          - reference/configuration.md
          - reference/database.md
          - reference/features.md
          - reference/elevation-sources.md

not_in_nav: |
  guides/fix-osm-errors.md
exclude_docs: |
