<!-- Zoom of the output pictures. A click on a picture opens it in a popup (lightbox). There: a click zooms in where you click, a second click shows the whole picture again. The mouse
     wheel or two fingers zoom, a drag moves the picture, and the buttons +, - and Fit do the same. -->
<script>window.__amd = window.define; window.define = undefined;</script>
<!-- require.js on the page: load Panzoom as a global -->
<script src="panzoom.min.js"></script> <!-- @panzoom/panzoom 4.5.1, MIT license -->
<script>window.define = window.__amd;</script>
<style>
  .rs-zoombar {
    position: fixed;
    left: 50%;
    top: 12px;
    transform: translateX(-50%);
    z-index: 999999;
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.7);
    color: #fff;
    font: 14px/1.2 system-ui, sans-serif;
  }

  .rs-zoombar button {
    min-width: 36px;
    height: 32px;
    border: 1px solid #888;
    border-radius: 6px;
    background: #222;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
  }

  .rs-zoombar span {
    margin-left: 6px;
    opacity: 0.85;
  }

  .gclose,
  .gnext,
  .gprev {
    z-index: 999999 !important;
  }

  .gslide-image img {
    cursor: zoom-in;
  }

  .cell-output-display a.lightbox img {
    cursor: zoom-in;
    max-height: 85vh;
    width: auto;
    max-width: 100%;
  }

  /* the whole picture fits the screen */
  .gslide-image img.rs-zoomed {
    cursor: grab;
  }

  @media (max-width: 600px) {
    .rs-zoombar span {
      display: none;
    }
  }

  .rs-zoomable {
    position: relative;
    display: inline-block;
    max-width: 100%;
  }

  .rs-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    font: 13px/1 system-ui, sans-serif;
    pointer-events: none;
    transition: background 0.15s;
  }

  .rs-zoomable:hover .rs-badge {
    background: rgba(0, 0, 0, 0.85);
  }

  .rs-zoomable:hover img {
    outline: 2px solid rgba(0, 0, 0, 0.25);
  }
</style>
<script>
  function initLightboxBadges() {
    if (typeof Panzoom === "undefined") return;
    const glass = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="5" ' +
      'fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.5 10.5 15 15M4.5 6.5h4M6.5 4.5v4" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    document.querySelectorAll(".cell-output-display a.lightbox:not(.rs-zoomable)").forEach((link) => {
      link.classList.add("rs-zoomable");
      const badge = document.createElement("span");
      badge.className = "rs-badge";
      badge.innerHTML = glass + "<span>Click to zoom</span>";
      link.appendChild(badge);
    });
    if (typeof lightboxQuarto !== "undefined" && typeof lightboxQuarto.reload === "function") {
      try { lightboxQuarto.reload(); } catch (e) {}
    }
  }

  window.addEventListener("load", () => {
    if (typeof Panzoom === "undefined") return;
    initLightboxBadges();
    if (typeof lightboxQuarto === "undefined") return;
    const g = lightboxQuarto.settings;
    g.draggable = false;          // a drag moves the picture, not to the next picture
    g.touchNavigation = false;    // the same for a finger on a phone
    g.zoomable = false;           // Panzoom zooms, not GLightbox
    let bar = null, current = null;
    function makeBar() {
      bar = document.createElement("div");
      bar.className = "rs-zoombar";
      bar.innerHTML = '<button data-z="in" title="Zoom in">+</button><button data-z="out" title="Zoom out">&minus;</button>' +
        '<button data-z="fit" title="The whole picture">Fit</button><span>Click, scroll or pinch to zoom. Drag to move.</span>';
      bar.addEventListener("click", (e) => {
        const z = e.target.dataset.z;
        if (!current || !z) return;
        if (z === "in") current.zoomIn(); else if (z === "out") current.zoomOut(); else current.reset();
      });
      document.body.appendChild(bar);
    }
    lightboxQuarto.on("open", () => { if (!bar) makeBar(); bar.style.display = "flex"; });
    lightboxQuarto.on("close", () => { if (bar) bar.style.display = "none"; current = null; });
    lightboxQuarto.on("slide_changed", ({ current: c }) => {
      const img = c.slideNode.querySelector(".gslide-image img");
      current = img && img._pz ? img._pz : current;
    });
    lightboxQuarto.on("slide_after_load", ({ slideNode }) => {
      const img = slideNode.querySelector(".gslide-image img");
      if (!img || img._pz) return;
      const vector = /\.svg($|\?)/.test(img.src);         // an SVG stays sharp: more zoom
      const pz = Panzoom(img, { maxScale: vector ? 20 : 8, minScale: 1, contain: "outside" });
      img._pz = pz; current = pz;
      img.parentElement.style.touchAction = "none";
      img.parentElement.style.overflow = "visible";      // the zoomed picture can fill the whole screen
      img.parentElement.addEventListener("wheel", (e) => pz.zoomWithWheel(e));
      img.addEventListener("panzoomchange", (e) => img.classList.toggle("rs-zoomed", e.detail.scale > 1.01));
      img.classList.remove("zoomable");                  // not the click zoom of GLightbox
      let down = null;
      img.addEventListener("pointerdown", (e) => { down = [e.clientX, e.clientY]; });
      img.parentElement.addEventListener("click", (e) => {    // first, before GLightbox sees the click
        e.stopPropagation();
        if (e.target !== img || !down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;    // a drag
        if (pz.getScale() > 1.01) pz.reset(); else pz.zoomToPoint(3, e);    // zoom in there, or the whole picture again
      }, true);
    });
  });
</script>
<!-- Web maps follow the theme of the page: the folium maps show their dark Esri layer in the dark theme, and the
     lonboard frames load the dark page (lonboard_*_dark.html in place of lonboard_*_light.html). -->
<script>
  (function () {
    function dark() { return document.body.classList.contains("quarto-dark"); }
    function folium(frame, isDark) {                   // a folium map: its tile layers are globals tile_layer_<id>
      const w = frame.contentWindow;
      if (!w || !w.L) return false;
      const names = Object.keys(w).filter((k) => k.startsWith("tile_layer_"));
      const map = Object.keys(w).filter((k) => k.startsWith("map_")).map((k) => w[k]).find((m) => m && m.addLayer);
      if (!map || names.length < 2) return true;
      names.forEach((k) => {
        const layer = w[k], isDarkLayer = /Dark_Gray/.test(layer._url || "");
        if (isDarkLayer === isDark) { if (!map.hasLayer(layer)) map.addLayer(layer); }
        else if (map.hasLayer(layer)) map.removeLayer(layer);
      });
      return true;
    }
    function apply() {
      const isDark = dark();
      document.querySelectorAll(".cell-output-display iframe").forEach((frame) => {
        const src = frame.getAttribute("src") || "";
        if (/lonboard_.*_(light|dark)\.html/.test(src)) {
          const want = src.replace(/_(light|dark)\.html/, isDark ? "_dark.html" : "_light.html");
          if (want !== src) frame.setAttribute("src", want);
        } else if (frame.hasAttribute("srcdoc") && !folium(frame, isDark)) {
          frame.addEventListener("load", () => folium(frame, dark()), { once: true });    // not loaded yet
        }
      });
    }
    window.__duckosm_applyMaps = apply;
    window.__duckosm_reinit = function () {
      if (typeof initLightboxBadges === "function") initLightboxBadges();
      if (typeof window.__duckosm_applyMaps === "function") window.__duckosm_applyMaps();
      if (typeof window.__duckosm_initToc === "function") window.__duckosm_initToc();
    };
    window.addEventListener("load", () => {
      apply();
      new MutationObserver(apply).observe(document.body, { attributes: true, attributeFilter: ["class"] });
    });
  })();
</script>
<!-- Maintain sidebar scroll position, instant SPA chapter navigation, and right panel TOC subsection controller -->
<script>
(function () {
  const KEY = "duckosm-book-sidebar-scroll";
  const desc = Object.getOwnPropertyDescriptor(Element.prototype, "scrollTop");
  const sb = document.getElementById("quarto-sidebar");

  if (sb && desc) {
    // 1. Intercept Quarto's ResizeObserver from snapping or changing sb.scrollTop
    Object.defineProperty(sb, "scrollTop", {
      get() {
        return desc.get.call(this);
      },
      set(val) {
        // Silently block Quarto's ResizeObserver snap!
        return;
      },
      configurable: true
    });

    // 2. Restore saved scroll position
    const saved = sessionStorage.getItem(KEY);
    if (saved !== null) {
      desc.set.call(sb, parseInt(saved, 10));
    }

    sb.addEventListener("scroll", () => {
      sessionStorage.setItem(KEY, desc.get.call(sb));
    }, { passive: true });
  }

  // --- Right Panel TOC & Subsection Controller ---
  function walkTocHierarchy(toc) {
    if (!toc) return;
    const allSubUls = toc.querySelectorAll("ul ul");
    allSubUls.forEach((ul) => {
      const hasActiveChild = !!ul.querySelector("a.nav-link.active");
      const prevA = ul.previousElementSibling;
      const parentIsActive = prevA && prevA.matches("a.nav-link") && prevA.classList.contains("active");

      if (hasActiveChild || parentIsActive) {
        ul.classList.remove("collapse");
        ul.classList.add("show");
      } else {
        ul.classList.add("collapse");
        ul.classList.remove("show");
      }
    });
  }

  function getTocItems(toc) {
    if (!toc) return [];
    const links = Array.from(toc.querySelectorAll("a.nav-link"));
    const items = [];
    for (const link of links) {
      const href = link.getAttribute("data-scroll-target") || link.getAttribute("href") || "";
      const id = href.replace(/^.*#/, "");
      if (!id) continue;
      const target = document.getElementById(id) || document.querySelector(`[data-anchor-id="${id}"]`);
      if (target) {
        items.push({ link, target });
      }
    }
    return items;
  }

  function initTocController() {
    const toc = document.querySelector("#quarto-margin-sidebar nav[role='doc-toc'], #TOC");
    if (!toc) return;

    function updateActiveOnScroll() {
      const items = getTocItems(toc);
      if (!items.length) return;

      const scrollPos = window.scrollY || window.pageYOffset;
      let activeItem = null;

      // When scrolled near the bottom of the page, activate the last section
      if (window.innerHeight + scrollPos >= document.body.offsetHeight - 50) {
        activeItem = items[items.length - 1];
      } else {
        for (let i = items.length - 1; i >= 0; i--) {
          const item = items[i];
          const top = item.target.getBoundingClientRect().top + scrollPos;
          if (scrollPos >= top - 110) {
            activeItem = item;
            break;
          }
        }
      }

      if (!activeItem && items.length) {
        activeItem = items[0];
      }

      if (activeItem) {
        items.forEach(({ link }) => {
          link.classList.toggle("active", link === activeItem.link);
        });
        walkTocHierarchy(toc);
      }
    }

    if (!window.__duckosm_toc_scroll_bound) {
      window.__duckosm_toc_scroll_bound = true;
      let scheduled = false;
      window.addEventListener("scroll", () => {
        if (!scheduled) {
          scheduled = true;
          requestAnimationFrame(() => {
            if (window.__duckosm_activeTocUpdater) {
              window.__duckosm_activeTocUpdater();
            }
            scheduled = false;
          });
        }
      }, { passive: true });
    }

    window.__duckosm_activeTocUpdater = updateActiveOnScroll;
    updateActiveOnScroll();
  }

  window.__duckosm_initToc = initTocController;

  function getFilename(href) {
    if (!href) return "";
    try {
      const u = new URL(href, window.location.href);
      return u.pathname.split("/").pop() || "index.html";
    } catch (e) {
      return href.split("/").pop() || "";
    }
  }

  function updateSidebarActive(targetFile) {
    const sidebar = document.getElementById("quarto-sidebar");
    if (!sidebar) return;
    sidebar.querySelectorAll("a.sidebar-link").forEach((link) => {
      const linkFile = getFilename(link.getAttribute("href"));
      const isActive = linkFile === targetFile;
      link.classList.toggle("active", isActive);
      if (isActive) {
        const sec = link.closest(".sidebar-section");
        if (sec && !sec.classList.contains("show")) {
          sec.classList.add("show");
        }
      }
    });
  }

  let isNavigating = false;
  async function navigateTo(url, pushState = true) {
    if (isNavigating) return;
    isNavigating = true;

    try {
      const res = await fetch(url);
      if (!res.ok) {
        window.location.href = url;
        return;
      }
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, "text/html");

      // 1. Swap main article content
      const newMain = doc.querySelector("#quarto-document-content");
      const curMain = document.querySelector("#quarto-document-content");
      if (newMain && curMain) {
        curMain.replaceWith(newMain);
      }

      // 2. Swap right margin sidebar (TOC)
      const newMargin = doc.querySelector("#quarto-margin-sidebar");
      const curMargin = document.querySelector("#quarto-margin-sidebar");
      if (newMargin && curMargin) {
        curMargin.replaceWith(newMargin);
      }

      // 3. Swap bottom page navigation (prev/next)
      const newPageNav = doc.querySelector("nav.page-navigation");
      const curPageNav = document.querySelector("nav.page-navigation");
      if (newPageNav && curPageNav) {
        curPageNav.replaceWith(newPageNav);
      } else if (newPageNav && !curPageNav) {
        const parent = document.querySelector("#quarto-content");
        if (parent) parent.appendChild(newPageNav);
      } else if (!newPageNav && curPageNav) {
        curPageNav.remove();
      }

      // 4. Update breadcrumbs
      const newBreadcrumbs = doc.querySelectorAll(".quarto-page-breadcrumbs");
      const curBreadcrumbs = document.querySelectorAll(".quarto-page-breadcrumbs");
      curBreadcrumbs.forEach((bc, idx) => {
        if (newBreadcrumbs[idx]) {
          bc.innerHTML = newBreadcrumbs[idx].innerHTML;
        }
      });

      // 5. Update left sidebar active indicator WITHOUT reloading or moving the sidebar
      const targetFile = getFilename(url);
      updateSidebarActive(targetFile);

      // 6. Update document title & history
      document.title = doc.title;
      if (pushState) {
        history.pushState({ url }, doc.title, url);
      }

      // 7. Scroll to target hash or top
      const parsedUrl = new URL(url, window.location.href);
      if (parsedUrl.hash) {
        const hashId = decodeURIComponent(parsedUrl.hash.slice(1));
        const hashEl = document.getElementById(hashId) || document.querySelector(`[data-anchor-id="${hashId}"]`);
        if (hashEl) {
          const top = hashEl.getBoundingClientRect().top + (window.scrollY || window.pageYOffset) - 75;
          window.scrollTo({ top: Math.max(0, top), behavior: "instant" });
        } else {
          window.scrollTo(0, 0);
        }
      } else {
        window.scrollTo(0, 0);
      }

      // 8. Re-initialize interactive widgets and right TOC
      if (window.__duckosm_reinit) {
        window.__duckosm_reinit();
      }
    } catch (e) {
      console.error("Instant navigation failed, falling back to full load:", e);
      window.location.href = url;
    } finally {
      isNavigating = false;
    }
  }

  // Intercept clicks on internal book links (left sidebar, right TOC subsections, prev/next buttons, breadcrumbs)
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (!a || !a.href) return;

    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (a.target && a.target !== "_self") return;
    if (a.hasAttribute("download")) return;

    const targetUrl = new URL(a.href, window.location.href);
    if (targetUrl.origin !== window.location.origin) return;

    // A. Right TOC subsection click
    const isTocLink = !!a.closest("#quarto-margin-sidebar, #TOC");
    if (isTocLink && targetUrl.hash) {
      const targetId = decodeURIComponent(targetUrl.hash.slice(1));
      const targetEl = document.getElementById(targetId) || document.querySelector(`[data-anchor-id="${targetId}"]`);
      if (targetEl) {
        e.preventDefault();
        const top = targetEl.getBoundingClientRect().top + (window.scrollY || window.pageYOffset) - 75;
        window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
        history.replaceState(null, "", targetUrl.hash);

        const toc = a.closest("#quarto-margin-sidebar nav[role='doc-toc'], #TOC");
        if (toc) {
          toc.querySelectorAll("a.nav-link").forEach((l) => l.classList.toggle("active", l === a));
          walkTocHierarchy(toc);
        }
        return;
      }
    }

    // B. Same-page anchor click elsewhere -> let browser smooth scrolling handle it
    if (targetUrl.pathname === window.location.pathname && targetUrl.search === window.location.search) {
      return;
    }

    // C. Only intercept links within /book/
    if (!targetUrl.pathname.includes("/book/")) return;

    const isSidebarLink = !!a.closest("#quarto-sidebar");
    const isPaginationLink = !!a.closest("nav.page-navigation");
    const isBreadcrumbLink = !!a.closest(".quarto-page-breadcrumbs");

    if (isSidebarLink || isPaginationLink || isBreadcrumbLink) {
      e.preventDefault();
      navigateTo(a.href, true);
    }
  });

  // Handle browser Back / Forward buttons
  window.addEventListener("popstate", (e) => {
    if (!window.location.pathname.includes("/book/")) {
      window.location.reload();
      return;
    }
    navigateTo(window.location.href, false);
  });

  // Run on initial page load
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initTocController);
  } else {
    initTocController();
  }
  window.addEventListener("load", initTocController);
})();
</script>
