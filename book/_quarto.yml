project:
  type: book
  output-dir: _book
  resources:
    - panzoom.min.js
    - lonboard_walking.html

book:
  title: "duckOSM"
  subtitle: "The notebook manual"
  repo-url: https://github.com/Khoshkhah/duckOSM
  repo-subdir: docs/notebooks
  search:
    location: sidebar
    type: textbox
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 2
    logo: duckosm-mark.svg
  chapters:
    - part: "Start"
      chapters:
        - index.qmd
    - part: "The core"
      chapters:
        - 01_area_to_network.ipynb
        - 02_inspect.ipynb
        - 03_maps.ipynb
        - 04_join_by_edge_id.ipynb
        - 05_osm_fixes.ipynb
        - 06_exports.ipynb
    - part: "The modules"
      chapters:
        - 07_routing.ipynb
        - 08_routing_advanced.ipynb
        - 09_analysis.ipynb
        - 10_gis.ipynb
        - 11_mobility.ipynb
        - 12_sim.ipynb
        - 13_planning.ipynb
        - 14_hdmap.ipynb
        - 15_ml.ipynb

language:
  search-text-placeholder: "Search the book"

execute:
  enabled: false        # the notebooks keep the outputs of their last run

crossref:
  fig-prefix: Figure

format:
  html:
    theme:
      light: [cosmo, book.scss]
      dark: [darkly, book.scss]
    number-sections: true
    number-depth: 3
    toc: true
    toc-depth: 3
    toc-expand: 1          # the subsections of a section show only when you read that section
    toc-location: right
    toc-title: "In this chapter"
    code-copy: true
    highlight-style:
      light: github
      dark: github-dark
    code-overflow: scroll
    fig-cap-location: bottom
    callout-appearance: default
    smooth-scroll: true
    lightbox: auto         # click a picture: it opens full screen
    include-after-body: zoom.html    # in the full-screen picture: the wheel or two fingers zoom, a drag moves it
    link-external-newwindow: true
