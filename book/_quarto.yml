project:
  type: book
  output-dir: _book

book:
  title: "duckOSM"
  subtitle: "The notebook manual"
  repo-url: https://github.com/Khoshkhah/duckOSM
  repo-subdir: docs/notebooks
  search:
    location: sidebar
    type: textbox
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 2
    logo: duckosm-mark.svg
  chapters:
    - part: "Start"
      chapters:
        - index.qmd
    - part: "The core"
      chapters:
        - 01_area_to_network.ipynb

language:
  search-text-placeholder: "Search the book"

execute:
  enabled: false        # the notebooks keep the outputs of their last run

crossref:
  fig-prefix: Figure

format:
  html:
    theme:
      light: [cosmo, book.scss]
      dark: [darkly, book.scss]
    number-sections: true
    number-depth: 3
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "In this chapter"
    code-copy: true
    highlight-style:
      light: github
      dark: github-dark
    code-overflow: scroll
    fig-cap-location: bottom
    callout-appearance: default
    smooth-scroll: true
    link-external-newwindow: true
