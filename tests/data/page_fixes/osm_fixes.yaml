      id: 503462470
      set:
        sidewalk: both
        surface: paved
    - type: way
      id: 23715051
      set:
        building:levels: '9'
      delete:
        - roof:shape
    - type: node
      id: 21912089
      set:
        highway: traffic_signals
    - type: relation
      id: 393226
      delete:
        - building
