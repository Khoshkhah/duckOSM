# Local corrections for known OSM source-data errors — see known_osm_issues.md (same folder).
#
# Applied to the `ways` table after RoadFilter and before GraphBuilder (once per mode), so both
# `oneway` (topological — decides whether a reverse-twin edge is created) and `lanes` take effect
# on a rebuild. Each rule is keyed by OSM `osm_id` and is a silent no-op in any area that doesn't
# contain that way, so this one global file is safe to apply to every build.
#
# Fields per rule:
#   osm_id          (required) the OSM way id
#   oneway          bool  — force one-way (true) / two-way (false)
#   lanes           int   — per-direction lane count; sets BOTH directions
#   lanes_forward   int   — per-direction (asymmetric roads)
#   lanes_backward  int
#   layer           int   — vertical stacking level (fixes a wrong OSM `layer` tag)
#   note            free text (provenance)
#
# Only enable a rule once the correction is verified — an unverified `oneway` flip silently drops
# the reverse edge. Keep unverified issues commented out.

overrides:
  # --- Södermalm ---
  - osm_id: 4392632          # Hökens Gata — missing oneway (known_osm_issues #1, CONFIRMED)
    oneway: true
    note: "Hökens Gata missing oneway; adjacent segment 676781760 is oneway=yes"

  - osm_id: 233761079        # Katarina Bangata — missing oneway (known_osm_issues #2, CONFIRMED)
    oneway: true
    note: "56 sibling Katarina Bangata segments are oneway=yes; this one just omits the tag (Overpass, 2026-07)"

  # --- Vancouver ---
  - osm_id: 507979055        # Trans-Canada WB @ Second Narrows — lanes undercount (known_osm_issues #3)
    lanes: 3
    note: "OSM lanes=2 but BC MoTI measured 3 WB lanes (P-15-21/22/23)"

  # --- Tartu ---
  - osm_id: 1429337399       # underground-parking ramp mis-tagged layer=-1 for its WHOLE length
    layer: 0                 # (known_osm_issues #4, CONFIRMED) — sits at grade where it meets the
    note: "service=driveway ramp tagged layer=-1 end-to-end though its junction end is at grade (joins the level-0 driveway 1429337400 at a shared node); no tunnel/bridge structure. Set to 0."


# Synthetic turn restrictions — for junctions where OSM is missing a `type=restriction` relation that
# physically exists, so duckOSM generates a forbidden movement. Injected into the restriction pipeline
# (RestrictionProcessor) so the edge graph, routing, GMNS movements, exports and the lane viz all drop
# the turn. Each rule maps from_way -> via_node -> to_way to edge ids (handles merged/reverse edges),
# and is a global no-op in areas that don't contain the ways. See docs/design/turn-restriction-overrides.md.
#   from_way, via_node, to_way  (required, OSM ids) · restriction (no_u_turn|no_left_turn|no_right_turn|
#   no_straight_on|only_*, default no_u_turn) · note
# Takes effect on the next driving rebuild (RestrictionProcessor runs it, then the edge graph drops it).
turn_restrictions:
  # --- Tartu ---
  - from_way: 1307524008     # no U-turn onto the opposing Tähe carriageway (known_osm_issues #6)
    via_node: 330045016
    to_way: 997402723
    restriction: no_u_turn
    note: "OSM lacks the restriction; the -166° turn from one-way link onto opposing/westbound Tähe is forbidden"
