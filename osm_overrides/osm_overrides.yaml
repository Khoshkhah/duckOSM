# Synthetic turn restrictions — for junctions where OSM is missing a `type=restriction` relation that
# physically exists, so duckOSM generates a forbidden movement. Injected into the restriction pipeline
# (RestrictionProcessor) so the edge graph, routing, GMNS movements, exports and the lane viz all drop
# the turn. Each rule maps from_way -> via_node -> to_way to edge ids (handles merged/reverse edges),
# and is a global no-op in areas that don't contain the ways. See docs/design/turn-restriction-overrides.md.
#   from_way, via_node, to_way  (required, OSM ids) · restriction (no_u_turn|no_left_turn|no_right_turn|
#   no_straight_on|only_*, default no_u_turn) · note
# Takes effect on the next driving rebuild (RestrictionProcessor runs it, then the edge graph drops it).
turn_restrictions:
  # --- Tartu ---
  - from_way: 1307524008     # no U-turn onto the opposing Tähe carriageway (known_osm_issues #6)
    via_node: 330045016
    to_way: 997402723
    restriction: no_u_turn
    note: "OSM lacks the restriction; the -166° turn from one-way link onto opposing/westbound Tähe is forbidden"


# New ways - the roads OSM does not have (docs/design/osm_override_new_ways.md). Added to raw.ways before any step reads it.
#   id         (required) 9,000,000,000,000 or more, used one time only; never change it (edge_ids hash it).
#              Convention here: 9,000,000,000,000 + the NVDB element id the way comes from
#   source     free text: where the way comes from (nvdb:<id>, ...)
#   nodes      in the way's direction: OSM node ids, or [lon, lat] for a new node (id: way id * 1000 + position).
#              Both ends must be OSM nodes, or the way is a dead end there
#   tags       OSM tags · tags_from: an OSM way whose tags (before any fix) the new way starts with · note
new_ways:
  # --- Stockholm, Norrmalm: Vasabron -> Fredsgatan (known_osm_issues #17) ---
  - id: 9000003678314
    source: nvdb:3678314
    nodes: [1740740220, 1740740223, 180929]
    tags_from: 40274443
    tags: {highway: unclassified, oneway: "yes", lanes: "2", "oneway:bicycle": "no"}
    note: "the east part of OSM cycleway 40274443, cut off by keep_nodes. NVDB segment 3678314 (Fredsgatan, tertiary, prohibited_direction_fwd=-1, drawn east to west): one-way east, from the northbound Vasabron carriageway (node 1740740220) to the Fredsgatan west end; agrees with Fredsgatan tube 01182324/2 'Mot Rödbodtorget'. Lanes 2 from the Google 3D top view (Kaveh, 2026-10-20). Class as Fredsgatan. oneway:bicycle=no keeps the cycle path's two directions (OSM: two-way cycleway)"
  # --- Stockholm, Norrmalm: Rödbodtorget, east of the building at the north end of Vasabron (known_osm_issues #18) ---
  - id: 9000001049107
    source: nvdb:1049107,1049108,1049109,1049110
    nodes: [180929, [18.063835, 59.328511], [18.063846, 59.328529], [18.063853, 59.328556], [18.063849, 59.328571],
            [18.063839, 59.328613], [18.063710, 59.328759], [18.063580, 59.328889], [18.063567, 59.328902], 180933]
    tags: {highway: tertiary, oneway: "yes", name: "Rödbodtorget"}
    note: "NVDB branch B of Rödbodtorget (tertiary, prohibited_direction_bwd=-1: one-way north), 69 m. Starts at OSM node 180929 (12.8 m from the NVDB start), ends at OSM node 180933 (1.9 m from the NVDB end); the inner points are the NVDB vertices. Branch A (NVDB 3678311, 3929353, 3678312) is left out: it would cut Tegelbacken edge 4271686175640876552 (Kaveh, 2026-10-20)"
