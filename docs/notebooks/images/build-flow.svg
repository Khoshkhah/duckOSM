<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="230" viewBox="0 0 1140 230" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="1140" height="230" rx="14" fill="#ffffff"/><rect x="16.0" y="30" width="196" height="96" rx="12" fill="#6e7781" fill-opacity="0.12" stroke="#6e7781" stroke-width="2"/><text x="114.0" y="60" text-anchor="middle" font-size="17" font-weight="700" fill="#6e7781">Your area</text><text x="114.0" y="86" text-anchor="middle" font-size="13" fill="#57606a">a name, an OSM id, a box,</text><text x="114.0" y="106" text-anchor="middle" font-size="13" fill="#57606a">a point, a polygon, a map</text><path d="M216.0 78 h18" stroke="#8c959f" stroke-width="2.5"/><path d="M234.0 72 l9 6 l-9 6 z" fill="#8c959f"/><rect x="244.0" y="30" width="196" height="96" rx="12" fill="#1f6feb" fill-opacity="0.12" stroke="#1f6feb" stroke-width="2"/><text x="342.0" y="60" text-anchor="middle" font-size="17" font-weight="700" fill="#1f6feb">Boundary</text><text x="342.0" y="86" text-anchor="middle" font-size="13" fill="#57606a">one polygon</text><text x="342.0" y="106" text-anchor="middle" font-size="13" fill="#57606a">&lt;name&gt;.geojson</text><path d="M444.0 78 h18" stroke="#8c959f" stroke-width="2.5"/><path d="M462.0 72 l9 6 l-9 6 z" fill="#8c959f"/><rect x="472.0" y="30" width="196" height="96" rx="12" fill="#1f6feb" fill-opacity="0.12" stroke="#1f6feb" stroke-width="2"/><text x="570.0" y="60" text-anchor="middle" font-size="17" font-weight="700" fill="#1f6feb">Extract</text><text x="570.0" y="86" text-anchor="middle" font-size="13" fill="#57606a">the Geofabrik file,</text><text x="570.0" y="106" text-anchor="middle" font-size="13" fill="#57606a">downloaded once (cache)</text><path d="M672.0 78 h18" stroke="#8c959f" stroke-width="2.5"/><path d="M690.0 72 l9 6 l-9 6 z" fill="#8c959f"/><rect x="700.0" y="30" width="196" height="96" rx="12" fill="#1f6feb" fill-opacity="0.12" stroke="#1f6feb" stroke-width="2"/><text x="798.0" y="60" text-anchor="middle" font-size="17" font-weight="700" fill="#1f6feb">Cut</text><text x="798.0" y="86" text-anchor="middle" font-size="13" fill="#57606a">only your area</text><text x="798.0" y="106" text-anchor="middle" font-size="13" fill="#57606a">&lt;name&gt;.osm.pbf</text><path d="M900.0 78 h18" stroke="#8c959f" stroke-width="2.5"/><path d="M918.0 72 l9 6 l-9 6 z" fill="#8c959f"/><rect x="928.0" y="30" width="196" height="96" rx="12" fill="#2ea043" fill-opacity="0.12" stroke="#2ea043" stroke-width="2"/><text x="1026.0" y="60" text-anchor="middle" font-size="17" font-weight="700" fill="#2ea043">Network</text><text x="1026.0" y="86" text-anchor="middle" font-size="13" fill="#57606a">the Rust build</text><text x="1026.0" y="106" text-anchor="middle" font-size="13" fill="#57606a">&lt;name&gt;.duckdb</text><path d="M244.0 142 H896.0" stroke="#1f6feb" stroke-width="2"/><text x="570.0" y="164" text-anchor="middle" font-size="14" fill="#1f6feb" font-family="Consolas, Menlo, monospace">duckosm.get(...) gives an Area</text><path d="M928.0 142 H1124.0" stroke="#2ea043" stroke-width="2"/><text x="1026.0" y="164" text-anchor="middle" font-size="14" fill="#2ea043" font-family="Consolas, Menlo, monospace">area.build()</text><path d="M16.0 188 H1124.0" stroke="#6e7781" stroke-width="2" stroke-dasharray="6 5"/><text x="570.0" y="212" text-anchor="middle" font-size="14" fill="#57606a" font-family="Consolas, Menlo, monospace">duckosm.network(...) does all the steps in one call</text></svg>