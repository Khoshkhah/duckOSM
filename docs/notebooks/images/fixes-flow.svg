<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
  <!-- inputs -->
  <rect x="20" y="40" width="190" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="115" y="70" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">OSM data</text>
  <text x="115" y="92" font-size="13" fill="#57606a" text-anchor="middle">monaco.osm.pbf</text>
  <rect x="20" y="170" width="190" height="80" rx="10" fill="#fff8e6" stroke="#d4a72c"/>
  <text x="115" y="200" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Fixes file</text>
  <text x="115" y="221" font-size="13" fill="#57606a" text-anchor="middle">osm_fixes.yaml</text>
  <text x="115" y="239" font-size="12" fill="#57606a" text-anchor="middle">you write it one time</text>
  <!-- build -->
  <rect x="290" y="100" width="150" height="80" rx="10" fill="#ddf4ff" stroke="#1f6feb"/>
  <text x="365" y="135" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Build</text>
  <text x="365" y="157" font-size="12" fill="#57606a" text-anchor="middle">applies the rules</text>
  <line x1="210" y1="75" x2="288" y2="125" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="210" y1="210" x2="288" y2="160" stroke="#d4a72c" stroke-width="2" marker-end="url(#arr)"/>
  <!-- network -->
  <rect x="510" y="100" width="150" height="80" rx="10" fill="#dafbe1" stroke="#2ea043"/>
  <text x="585" y="135" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Network</text>
  <text x="585" y="157" font-size="12" fill="#57606a" text-anchor="middle">monaco.duckdb</text>
  <line x1="440" y1="140" x2="508" y2="140" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <!-- outputs -->
  <g font-size="13" fill="#1f2328" text-anchor="middle">
    <rect x="730" y="20" width="150" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="805" y="43">routes and maps</text>
    <rect x="730" y="66" width="150" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="805" y="89">SUMO, MATSim</text>
    <rect x="730" y="112" width="150" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="805" y="135">GMNS</text>
    <rect x="730" y="158" width="150" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="805" y="181">GeoPackage</text>
    <rect x="730" y="204" width="150" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="805" y="227">OpenDRIVE</text>
    <rect x="730" y="250" width="150" height="36" rx="8" fill="#fff8e6" stroke="#d4a72c"/><text x="805" y="273">QuackOSM table</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M660,140 L695,140 L695,38 L728,38"/>
    <path d="M695,84 L728,84"/>
    <path d="M695,130 L728,130"/>
    <path d="M695,140 L695,176 L728,176"/>
    <path d="M695,176 L695,222 L728,222"/>
  </g>
  <path d="M210,240 C420,300 600,290 728,268" stroke="#d4a72c" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="470" y="252" font-size="12" fill="#57606a" text-anchor="middle">quack reads the OSM file and the fixes file</text>
</svg>
