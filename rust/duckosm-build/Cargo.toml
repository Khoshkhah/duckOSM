[package]
name = "duckosm-build"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["duckdb", "zstd", "tzf", "gpkg", "postgis"]
# quack --osm2pgsql -f postgis: the tables straight into a PostGIS database (a network client: not in the browser build)
postgis = ["dep:postgres"]
# quack --gdal -f gpkg: the GeoPackage (SQLite, a C library: not in the browser build)
gpkg = ["dep:rusqlite"]
# the time zone of an area from the world map of tzf-rs (2.7 MB with gzip): natively; the browser build uses the
# page's time zone table (www/timezones.json) instead
tzf = ["dep:tzf-rs"]
duckdb = ["dep:duckosm-duckdb"]
# Pure-Rust compression for the GeoParquet files (WebAssembly); the default is zstd.
snap = ["duckosm-parquet/snap"]
# zstd is a C library: the browser build (duckosm-wasm) leaves it out and uses snap.
zstd = ["duckosm-parquet/zstd", "duckosm-core/zstd"]

[dependencies]
duckosm-core = { path = "../duckosm-core" }
duckosm-parquet = { path = "../duckosm-parquet", default-features = false, features = ["pbf"] }
duckosm-duckdb = { path = "../duckosm-duckdb", optional = true }
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
postgres = { version = "0.19", optional = true }
# the files of the tiles of quack --gdal in the browser (Snappy frames, pure Rust; the name "snap" is a feature here)
snappy = { package = "snap", version = "1" }
yaml-rust2 = "0.13"
# the H3 columns (h3.rs): pure Rust, its cells equal those of the C library that the Python package h3 wraps
h3o = { version = "0.11", features = ["geo"] }
# the polygons of the boundary cells (h3o's tiler takes geo's types)
geo = { version = "0.33", default-features = false }
# the area's time zone in main.visualization_metadata, from the coordinates (duckOSM uses timezonefinder);
# without the command-line program of the crate
tzf-rs = { version = "2.1", default-features = false, features = ["bundled"], optional = true }
# main.boundary keeps the order of the properties of the file, as GDAL does
# the DEM of the elevation step (a GeoTIFF, uncompressed or deflate)
tiff = { version = "=0.11.3", default-features = false, features = ["deflate", "lzw"] }
# the ground id in main.elevation_metadata: the SHA-256 of the DEM file
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
# the tiles of the levels that do not wait for each other run at the same time (the same rayon as duckosm-core)
rayon = "1.12"
# the build of a tile keeps only its own rows (union.rs, own_rows)
arrow-array = "=60.0.0"
# roadstyle's engine in Rust (roadstyle repository, rust/): the drawing levels (levels.rs), roadstyle's rules in one place
roadstyle-levels = { workspace = true }

[dev-dependencies]
# the golden file of quack --gdal (tests/quack_gdal_monaco.rs)
flate2 = "1"
# the tests read the .duckdb file that the build writes (the version of duckosm-duckdb)
duckdb = { version = "=1.10506.1", features = ["bundled"] }
