[package]
name = "duckosm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["pbf"]
# Reading a .osm.pbf file. Off for builds that get their data from somewhere else (WebAssembly).
pbf = ["dep:osmpbf", "dep:rayon", "dep:flate2"]
# zstd for the temporary files of StrSort (else the blocks have no compression)
zstd = ["dep:zstd"]

[dependencies]
# the tile cut (`tilecut`), the boundary, the map tiles and the temporary store: the pbfcut library, at one pinned commit
pbfcut = { git = "https://github.com/Khoshkhah/pbfcut.git", rev = "2facc00595ff6397660d76211ca255098affab38" }
rstar = "0.12"
# the map matching with GPS-DTW (`matching::match_trace_dtw`): the plain Rust matcher of gps-dtw, at one pinned commit
gps-dtw = { git = "https://github.com/Khoshkhah/gps-dtw.git", rev = "62538f37589e5f51ad1a3d030a0d2774f16302c4", default-features = false }
osmpbf = { version = "0.3.8", optional = true }
# pbfraw inflates the blocks with flate2; zlib-rs is a pure-Rust zlib that also builds for WebAssembly
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"], optional = true }
# the passes of the cut to a boundary decode the blocks in parallel (the same rayon as osmpbf)
rayon = { version = "1.12", optional = true }
# OSM JSON (the output format of the Overpass API): the input of the browser page from a place name
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the zlib blobs of the .osm.pbf that cutfile.rs writes: pure Rust, so every target writes the same bytes
miniz_oxide = "0.8"
# quack.rs: the polygons of QuackOSM's features table (ring check by a sweep, orientation, relate); pure Rust, also for
# WebAssembly. The version that roadstyle-tiles already uses.
geo = { version = "0.33", default-features = false }
# the union and the difference of quack.rs: the i_overlay of geo 0.33, called directly to keep the points on the edges
i_overlay = { version = "4.5", default-features = false }
# the blocks of the temporary files of the sort of quack.rs (StrSort); a C library, so not in the browser build. The
# version of parquet's zstd.
zstd = { version = "0.14", optional = true }
# mvt.rs and shortbread.rs: tan, ln, sinh and the other functions in pure Rust, so the tiles have the same bytes on
# each platform and in the browser (the functions of std call the math library of the system)
libm = "0.2"
# spill.rs: the Snappy blocks of the runs of a sort (Sorter::snappy, the rows of quack --pmtiles); pure Rust, also in the browser
snap = "1"

# util::raise_open_files: the tiles of quack keep many temporary files open
[target.'cfg(unix)'.dependencies]
libc = "0.2"
