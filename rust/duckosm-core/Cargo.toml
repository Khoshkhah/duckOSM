[package]
name = "duckosm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["pbf"]
# Reading a .osm.pbf file. Off for builds that get their data from somewhere else (WebAssembly).
pbf = ["dep:osmpbf", "dep:rayon", "dep:flate2"]

[dependencies]
rstar = "0.12"
osmpbf = { version = "0.3.8", optional = true }
# pbfraw inflates the blocks with flate2; zlib-rs is a pure-Rust zlib that also builds for WebAssembly
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"], optional = true }
# the passes of the cut to a boundary decode the blocks in parallel (the same rayon as osmpbf)
rayon = { version = "1.12", optional = true }
# OSM JSON (the output format of the Overpass API): the input of the browser page from a place name
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the zlib blobs of the .osm.pbf that cutfile.rs writes: pure Rust, so every target writes the same bytes
miniz_oxide = "0.8"
# quack.rs: the polygons of QuackOSM's features table (ring check by a sweep, orientation, relate); pure Rust, also for
# WebAssembly. The version that roadstyle-tiles already uses.
geo = { version = "0.33", default-features = false }
# the union and the difference of quack.rs: the i_overlay of geo 0.33, called directly to keep the points on the edges
i_overlay = { version = "4.5", default-features = false }
