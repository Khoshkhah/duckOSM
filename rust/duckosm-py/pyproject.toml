[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "duckosm-rust"
version = "0.3.0"
description = "The network step of duckOSM in Rust: an .osm.pbf file in, road edges and nodes out (DuckDB and GeoParquet)"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Rust"]

[tool.maturin]
module-name = "duckosm_rust"
