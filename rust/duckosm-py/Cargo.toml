[package]
name = "duckosm-py"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_rust"
crate-type = ["cdylib"]

[features]
default = ["duckdb"]
# duckdb: the .duckdb output, and the whole program duckosm in the module (`cli`, the exports, the routing, the tools)
duckdb = ["duckosm-build/duckdb", "duckosm-build/gpkg", "duckosm-edit/duckdb", "dep:duckosm-export", "dep:duckosm-tools", "dep:duckosm-route",
          "dep:clap", "dep:rayon", "dep:serde_json", "dep:duckdb"]
# the CLI's measurement of the heap (rust/duckosm-cli): never on in the module
heap-probe = []

[dependencies]
duckosm-build = { path = "../duckosm-build", default-features = false, features = ["zstd", "tzf"] }
duckosm-core = { path = "../duckosm-core" }
duckosm-edit = { path = "../duckosm-edit" }    # duckosm edit: the page and its server; the database is Python's (duckosm/edit.py)
# the program duckosm (rust/duckosm-cli/src/main.rs is compiled into the module: `cli`)
duckosm-export = { path = "../duckosm-export", optional = true }
duckosm-tools = { path = "../duckosm-tools", optional = true }
duckosm-route = { path = "../duckosm-route", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
rayon = { version = "1.12", optional = true }
serde_json = { version = "1", features = ["preserve_order"], optional = true }
duckdb = { version = "=1.10506.1", optional = true }   # the connection of a Router (the version of duckosm-route)
pyo3 = { version = "0.30", features = ["abi3-py39", "extension-module"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
