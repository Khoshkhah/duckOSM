[package]
name = "duckosm-py"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "duckosm_rust"
crate-type = ["cdylib"]

[features]
default = ["duckdb"]
duckdb = ["duckosm-build/duckdb"]

[dependencies]
duckosm-build = { path = "../duckosm-build", default-features = false, features = ["zstd", "tzf"] }
duckosm-core = { path = "../duckosm-core" }
pyo3 = { version = "0.30", features = ["abi3-py39", "extension-module"] }
