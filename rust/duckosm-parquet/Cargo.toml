[package]
name = "duckosm-parquet"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["zstd"]
# zstd is a C library: it does not build for WebAssembly. Use "snap" (pure Rust) there.
zstd = ["parquet/zstd"]
snap = ["parquet/snap"]
# load_raw: the load step reads the .osm.pbf file (docs/design/streaming_load.md)
pbf = ["duckosm-core/pbf"]

[dependencies]
duckosm-core = { path = "../duckosm-core", default-features = false }
arrow-array = "=60.0.0"
arrow-schema = "=60.0.0"
parquet = { version = "=60.0.0", default-features = false, features = ["arrow"] }
# the writers encode the columns of a row group on all threads; load_raw_here decodes the blocks on all threads
rayon = "1.12"
# the rows of visualization.edge_levels (the same commit as duckosm-build)
roadstyle-levels = { git = "https://github.com/Khoshkhah/roadstyle.git", rev = "d9dfcdca5c02aa5fd11e95267c4ee618b429a39a" }

[dev-dependencies]
duckosm-core = { path = "../duckosm-core" }

# the memory of the load step stays in its budget (a counting allocator, so a test file of its own)
[[test]]
name = "load_memory"
required-features = ["pbf"]
