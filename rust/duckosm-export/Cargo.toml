[package]
name = "duckosm-export"
version.workspace = true
edition.workspace = true
license.workspace = true

# The exports of a built duckOSM database (docs/design/all_in_rust.md, group D). Each export reads the .duckdb file
# with DuckDB and writes the same file as the Python export of src/duckosm/.

[dependencies]
duckdb = { version = "=1.10506.1", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
# the node types of the SUMO export, which the chains of duckosm-core share
duckosm-core = { path = "../duckosm-core", default-features = false }
flate2 = "1"
geo = { version = "0.33", default-features = false }
# the lane lines of the GMNS runs on all cores
rayon = "1.12"
# the map tiles of GMNS by tiles: the tile grid of the tile cut (the rev of duckosm-core)
pbfcut = { git = "https://github.com/Khoshkhah/pbfcut.git", rev = "2facc00595ff6397660d76211ca255098affab38" }
# the join of the layer files into one GeoPackage (the version of duckosm-build)
rusqlite = { version = "0.39", features = ["bundled"] }

[dev-dependencies]
duckosm-build = { path = "../duckosm-build" }
