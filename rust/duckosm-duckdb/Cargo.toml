[package]
name = "duckosm-duckdb"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
duckdb = { version = "=1.10506.1", features = ["bundled", "parquet", "appender-arrow", "vtab"] }
# the load step written directly into DuckDB (raw.rs, docs/design/streaming_load.md): the parts of duckosm-parquet
# (Arrow 60) go to the Arrow of the duckdb crate (58) through the Arrow C data interface
duckosm-core = { path = "../duckosm-core" }
duckosm-parquet = { path = "../duckosm-parquet", default-features = false, features = ["pbf"] }
arrow-array = { version = "=60.0.0", features = ["ffi"] }
arrow-schema = "=60.0.0"

[dev-dependencies]
rayon = "1.12"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
duckosm-core = { path = "../duckosm-core", default-features = false }
