[package]
name = "duckosm-duckdb"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
duckdb = { version = "=1.10506.1", features = ["bundled", "parquet", "vtab"] }
# read_osm (docs/design/streaming_load.md): the PBF decoder of duckosm-core, the Arrow columns of duckosm-parquet
duckosm-core = { path = "../duckosm-core" }
duckosm-parquet = { path = "../duckosm-parquet", default-features = false, features = ["pbf"] }
arrow-array = "=60.0.0"
arrow-schema = "=60.0.0"

[dev-dependencies]
duckosm-core = { path = "../duckosm-core", default-features = false }
