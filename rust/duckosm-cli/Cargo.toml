[package]
name = "duckosm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "duckosm-rust"
path = "src/main.rs"

[features]
default = ["duckdb"]
duckdb = ["duckosm-build/duckdb", "dep:duckosm-edit", "duckosm-edit/duckdb"]
# a counting allocator: after each step, the live and the peak Rust heap (docs/design/network_stream.md). DuckDB's own memory is
# not counted (it has its own memory_limit). Only for measurements: the counting costs some time.
heap-probe = []

[dependencies]
duckosm-build = { path = "../duckosm-build", default-features = false, features = ["zstd", "tzf"] }
clap = { version = "4", features = ["derive"] }
duckosm-edit = { path = "../duckosm-edit", optional = true }   # duckosm-rust edit: the page that edits the fixes (needs DuckDB)
