[build-system]
# one wheel with the Rust engine in it: the module duckosm._rust (rust/duckosm-py, abi3). docs/design/rust_engine_move.md
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "duckosm"
version = "0.8.0"
description = "High-performance OSM-to-routing-network converter built on DuckDB"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kaveh Khoshkhah" }]
keywords = ["osm", "openstreetmap", "routing", "duckdb", "h3", "network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "duckdb>=1.0.0,<2",   # edge_id uses DuckDB's hash(): pin the major version
    "shapely>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "h3>=4.0.0",
    "rich>=13.0.0",
    "pandas",             # gmns exporter (lane/curb tables); numpy already comes with shapely
    "timezonefinder>=6.0",  # every area db stores its IANA time zone
]

[project.scripts]
duckosm = "duckosm._main:main"   # the Rust program (duckosm._rust.cli); the Python CLI for the commands that are not ported yet

[project.optional-dependencies]
levels = ["roadstyle>=0.24.2"]               # duckosm levels: the level area (roadstyle-levels: make, solve, edit; its solver)
viz = ["mapstyle>=0.7.0", "lanestyle>=0.4.0"]  # duckosm viz / route-map / gmns-map (mapstyle brings roadstyle, geopandas)
networkx = ["networkx"]
routing = ["networkx"]                       # the old name of the extra networkx: removed in the next release
rustworkx = ["rustworkx>=0.15"]                # duckosm.to_rustworkx: the graphs as rustworkx graphs (a Rust engine)
sumo = ["eclipse-sumo"]
dev = ["roadstyle>=0.24.2", "pytest", "black", "ruff", "networkx", "rustworkx>=0.15", "lxml", "frictionless", "path4gmns"]   # lxml: MATSim network_v2 DTD validation in tests

[project.urls]
Homepage = "https://github.com/khoshkhah/duckOSM"
Repository = "https://github.com/khoshkhah/duckOSM"
Issues = "https://github.com/khoshkhah/duckOSM/issues"

[tool.maturin]
python-source = "src"
module-name = "duckosm._rust"
manifest-path = "rust/duckosm-py/Cargo.toml"
# the module has DuckDB (the cargo feature duckdb): the whole program duckosm is in it (duckosm._rust.cli)
profile = "release"    # a debug build of the engine is slow, also in pip install -e .
# the sdist has all of rust/: the workspace lists duckosm-duckdb and duckosm-cli, which the module does not need,
# and cargo reads their manifests
include = [{ path = "rust/**/*", format = "sdist" }, { path = "web/fixes_editor/*", format = "sdist" }, { path = "web/ask/*", format = "sdist" }, { path = "web/ground_step/*", format = "sdist" }, { path = "web/build_steps/*", format = "sdist" }]   # duckosm-edit embeds the fixes editor, the questions of Ask and the steps of the pages
exclude = [{ path = "rust/target/**", format = "sdist" }]
