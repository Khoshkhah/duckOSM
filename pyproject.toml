[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duckosm"
version = "0.2.0"
description = "High-performance OSM-to-routing-network converter built on DuckDB"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kaveh Khoshkhah" }]
keywords = ["osm", "openstreetmap", "routing", "duckdb", "h3", "network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "duckdb>=1.0.0,<2",   # edge_id uses DuckDB's hash(): pin the major version
    "shapely>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "h3>=4.0.0",
    "rich>=13.0.0",
    "pandas",             # gmns exporter (lane/curb tables); numpy already comes with shapely
    "timezonefinder>=6.0",  # every area db stores its IANA time zone
]

[project.scripts]
duckosm = "duckosm.cli:main"

[project.optional-dependencies]
levels = ["roadstyle>=0.13.1"]               # duckosm levels: the drawing order (roadstyle brings its solver, geopandas)
viz = ["mapstyle>=0.2.0", "lanestyle>=0.2.1"]  # duckosm viz / route-map / gmns-map (mapstyle brings roadstyle, geopandas)
routing = ["networkx"]
sumo = ["eclipse-sumo", "sumolib"]
elevation = ["rasterio>=1.3", "pyproj>=3.0"]
dev = ["roadstyle>=0.13.1", "pytest", "black", "ruff", "networkx", "lxml", "frictionless", "path4gmns"]   # lxml: MATSim network_v2 DTD validation in tests

[project.urls]
Homepage = "https://github.com/khoshkhah/duckOSM"
Repository = "https://github.com/khoshkhah/duckOSM"
Issues = "https://github.com/khoshkhah/duckOSM/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duckosm = ["templates/*.yaml", "templates/*.html"]    # init-config template; the route planner page
