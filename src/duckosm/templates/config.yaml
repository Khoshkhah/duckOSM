# duckOSM configuration — FULL TEMPLATE
# Copy, edit, and run with:
#   duckosm build --config config/<your>.yaml
# Every key shows its default; omit any key to accept that default.
#
# Two source modes:
#   source.type: pbf     -> build a network from OSM (download / clip / filter / graph)
#   source.type: duckdb  -> CLIP an existing duckOSM db (e.g. sodermalm <- sweden),
#                           preserving edge_ids (no re-hash, no cross-project re-key).
#
# Full reference: docs/configuration.md · https://khoshkhah.github.io/duckOSM/concepts/build/ · docs/design/pipeline_update_plan.md

name: my_import                        # REQUIRED — logical name + output filename (<name>.duckdb)
output_path: .                         # a directory (-> ./<name>.duckdb) OR a full *.duckdb path.
                                       # Relative paths resolve against the folder you run duckosm in.

# ---- SOURCE: where the network comes from (set type, fill that block) -------
source:
  type: pbf                            # 'pbf' | 'duckdb'

  # -- type: pbf (build from OSM) --
  pbf_path: input.osm.pbf              # local .osm.pbf, e.g. from https://download.geofabrik.de

  # -- type: duckdb (derive THIS area by clipping a parent build) --
  source_db: null                      # parent duckOSM db, e.g. sweden.duckdb; edge_ids are kept

# ---- BOUNDARY: the clip region (optional; needed for type: duckdb) ---------
boundary:
  path: null                           # GeoJSON polygon file
  buffer_m: 0                          # optional outward buffer (metres) before clipping

# ---- CLIP behaviour (clean-up applied after selection / extraction) ---------
clip:
  predicate: intersects                # 'within' | 'intersects' | 'centroid'  (edge-vs-boundary test)
  keep_largest_component: true         # drop disconnected boundary stubs -> one clean network
  min_component_edges: 1               # also drop weak components smaller than this
  connectivity_rescue: true            # re-admit a 'maybe' connector iff it reconnects a drive component
  strongly_connected: false            # false = weakly-connected keep; true = require routable round-trip

# ---- MODES -----------------------------------------------------------------
modes:
  - driving
  # - walking
  # - cycling

# ---- BUILD OPTIONS (source.type: pbf; mostly inert for a duckdb clip) -------
options:
  build_graph: true                    # edge-adjacency (edge_graph) table
  h3_indexing: true                    # from_cell / to_cell / lca_res on edges
  h3_resolution: 8                     # 0-15
  simplify: true                       # contract degree-2 nodes
  merge_segments: true                 # DEFAULT ON. merge consecutive same-road segments (degree-2 chains); writes <mode>.edge_id_map. set false for a no-merge build
  process_speeds: true                 # maxspeed_kmh (drops the raw maxspeed string)
  cycling_dismount: true               # cycling gets footway/pedestrian as dismount=TRUE edges (walking speed, bidirectional) — keeps footway-linked cycleways alive. See docs/design/cycling_dismount_edges.md
  extract_restrictions: true           # turn_restrictions (driving only)
  calculate_costs: true                # cost_s travel time
  boundary_cells: false                # main.boundary_cells H3 grid (needs a boundary)
  boundary_cell_resolutions: null      # e.g. [6, 7, 8]; null = [h3_resolution]
  memory_limit: null                   # e.g. "16GB"; null = DuckDB default
  threads: null                        # cap worker threads; null = DuckDB default
  simplify_batches: 0                  # 0 = auto-size by node count; 1 = single pass

# ---- VALIDATION (run after build; fail loudly on a broken invariant) -------
validation:
  enabled: true
  fail_on_error: true
  assert_single_component: true        # <=1 dominant component after clip
  assert_no_stranded_named: true       # no named drivable through-street left disconnected
  assert_edge_id_stable: true          # regression vs fixture (pbf) / vs parent (duckdb)
  warn_layer_without_structure: true   # WARN: layer≠0 without bridge/tunnel (OSM tagging smell)

# ---- MULTIMODAL (intermodal walk<->drive<->cycle routing; see https://khoshkhah.github.io/duckOSM/concepts/multimodal/) --
multimodal:
  enabled: false                       # build the mm.* transfer graph after the per-mode builds
  transfer_s: 60                       # flat transfer penalty (seconds) at each shared junction (v1 coarse)
  realistic: false                     # v2 park-and-ride (extract parking POIs) — NOT yet implemented
  transfer_costs: null                 # optional per-direction overrides, e.g. {"walking->driving": 60, "driving->walking": 30}
  categories: null                     # v2 OSM POI categories (reserved)
  # NOTE: needs >=2 modes AND `walking` present (walking is the pedestrian hub between modes).

# ---- REPORT + VISUALIZATION ------------------------------------------------
report:
  enabled: true                        # write reports/<name>_<ts>.{md,html} (stats, filter audit, components, validation)
viz:
  enabled: false                       # roadstyle map -> reports/<name>_network.html (+ .png)
  basemap: carto-voyager               # carto-voyager | carto-positron | carto-dark | osm

# ---- LOCAL OSM FIXES AND CACHING ---------------------------------------------
osm_overrides: null                    # a rules file of fixes for OSM errors (docs: "Fix OSM errors");
                                       # only used when named here or with `build --fixes`
# With a boundary (and osmium installed) the PBF is first clipped to it; the clipped copy is
# cached in ./pbf/ and reused by the next build of the same area.
