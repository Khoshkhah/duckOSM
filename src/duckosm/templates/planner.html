<!-- duckOSM's route planner page (docs/design/viz_on_mapstyle.md), injected by route_map.py over a map
     drawn by mapstyle. Drag the start / end markers; Dijkstra over the embedded graphs (RM), as
     duckOSM's route_points() / route_multimodal_points() (docs/design/point_routing.md): a marker
     joins its roads within the radius by a walk, and the first / last edges count only the part
     travelled. The directions follow duckosm.directions(); tests/test_maps.py keeps them equal.
     Copied from mapstyle's demo planner (which began as this page). Roads are matched by edge_id. -->

<div id="rm-panel">
  <div class="rm-head"><div><h3>Route planner</h3>
  <p class="rm-hint">Drag the two pins to set the start and the end. Click a road to copy its <code>edge_id</code>.</p></div>
  <button type="button" class="rm-theme" id="rm-theme" aria-label="Switch between light and dark" title="Light / dark">&#9790;</button></div>
  <select id="rm-mode" aria-label="Mode"></select>
  <div class="rm-seg" id="rm-modes" role="group" aria-label="Mode"></div>
  <div class="rm-seg" id="rm-weight" role="group" aria-label="Weight">
    <input type="radio" name="rm-w" value="time" checked><input type="radio" name="rm-w" value="length">
    <button type="button" data-w="time" class="on">Fastest</button><button type="button" data-w="length">Shortest</button>
  </div>
  <div class="rm-pts">
    <div class="rm-pt"><span class="rm-pin" style="--c:var(--start)">A</span><div><small>Start</small><b id="rm-from">…</b></div></div>
    <div class="rm-pt"><span class="rm-pin" style="--c:var(--end)">B</span><div><small>End</small><b id="rm-to">…</b></div></div>
    <button type="button" class="rm-swap" id="rm-swap" title="Swap start and end" aria-label="Swap start and end">&#8645;</button>
  </div>
  <div id="rm-result"></div>
  <p class="rm-note" id="rm-note"></p>
  <details id="rm-more"><summary>Settings and details</summary>
    <div class="rm-opts" id="rm-off" title="A marker may be off the road up to this distance; that walk costs walking time">
      <label>Off-road up to (m)<input id="rm-radius" type="number" min="0" max="2000" step="5" value="50"></label>
      <label>Walking speed (km/h)<input id="rm-speed" type="number" min="0.5" max="10" step="0.5" value="4.5"></label>
    </div>
    <div id="rm-edges"></div>
    <p class="rm-clicked" id="rm-clicked"></p>
  </details>

<script>const RM = __RM__;</script>
<script>
(function () {
  const COLORS = {walking: "#16a34a", driving: "#dc2626", cycling: "#2563eb"};
  const LABEL = {walking: "Walk", driving: "Drive", cycling: "Cycle"};
  const D = RM, hub = D.modes.indexOf("walking");
  const AT = new Map(D.eid.map((e, k) => [e, k]));            // edge_id -> index in the data
  let fid = null, markers = {A: null, B: null}, picked = {A: null, B: null};

  // ---- small binary heap -----------------------------------------------------------------------
  function Heap() { this.a = []; }
  Heap.prototype.push = function (d, x) {
    const a = this.a; a.push([d, x]); let i = a.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; }
  };
  Heap.prototype.pop = function () {
    const a = this.a, top = a[0], last = a.pop();
    if (a.length) { a[0] = last; let i = 0;
      for (;;) { const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < a.length && a[l][0] < a[m][0]) m = l; if (r < a.length && a[r][0] < a[m][0]) m = r;
        if (m === i) break; [a[m], a[i]] = [a[i], a[m]]; i = m; } }
    return top;
  };

  // ---- one mode: edge-based Dijkstra over edge_graph, as route() -----------------------------------
  const G = {};
  for (const m of D.modes) { const g = D.graphs[m]; g.pos = new Map(g.k.map((k, i) => [k, i])); G[m] = g; }
  function routeOne(mode, s, t, weight) {
    const g = G[mode], w = weight === "length" ? g.len : g.cost;
    const dist = new Map([[s, 0]]), prev = new Map(), h = new Heap(); h.push(0, s);
    while (h.a.length) {
      const [d, u] = h.pop(); if (d > dist.get(u)) continue; if (u === t) break;
      const i = g.pos.get(u), wu = w[i];
      for (const v of g.next[i]) { const nd = d + wu;
        if (nd < (dist.has(v) ? dist.get(v) : Infinity)) { dist.set(v, nd); prev.set(v, u); h.push(nd, v); } }
    }
    if (!dist.has(t)) return null;
    const path = [t]; while (path[path.length - 1] !== s) path.push(prev.get(path[path.length - 1]));
    path.reverse();
    let time = 0, len = 0; for (const k of path) { const i = g.pos.get(k); time += g.cost[i]; len += g.len[i]; }
    return {time, len, legs: [{mode, edges: path, time, len}], transfers: 0};
  }

  // ---- across modes: Dijkstra over roads, as route_multimodal(): every part of the trip follows the
  // edge_graph of its own mode (turn restrictions included). A state is a road with its cost paid
  // (kind 0) or a junction just after a change of mode (kind 1), with the phase walk* veh* walk*
  let MM = null;
  if (D.mm) {
    const tadj = new Map(), out = new Map();       // "mode:node" -> changes of mode / roads that leave the node
    for (const [n, fm, tm, c] of D.mm.transfers) { const key = fm + ":" + n; if (!tadj.has(key)) tadj.set(key, []); tadj.get(key).push([tm, c]); }
    D.modes.forEach((m, mi) => { for (const k of G[m].k) { const key = mi + ":" + D.src[k]; if (!out.has(key)) out.set(key, []); out.get(key).push(k); } });
    MM = {tadj, out, span: Math.max(D.n, D.mm.nodes) + 2};
  }
  // pts: null (from the node sNode to the node tNode) or {S, T: Map(k -> candidate)}, the start and end
  // candidates on walking roads, v the walking speed (route_multimodal_points). weight "length"
  // (Shortest): the search adds metres, not seconds; a change of mode is 0.1 m (no change that is not shorter)
  function routeMulti(sNode, tNode, allowed, pts, v, weight) {
    const {tadj, out, span} = MM, END = -1;
    const key = (kind, m, id, p) => ((kind * 8 + m) * span + id) * 3 + p;
    const cost = (m, k) => { const g = G[D.modes[m]]; return g.cost[g.pos.get(k)]; };
    const byLen = weight === "length", wt = byLen ? (m, k) => D.len[k] : cost;
    const acc = (dm) => byLen ? dm : dm / v, trW = (c) => byLen ? 0.1 : c;   // a walk off the road; a change of mode
    const dist = new Map(), prev = new Map(), state = new Map(), h = new Heap();
    const push = (d, s, from, step) => {
      const kk = s ? key(...s) : END;
      if (d < (dist.has(kk) ? dist.get(kk) : Infinity)) { dist.set(kk, d); prev.set(kk, [from, step]); state.set(kk, s); h.push(d, kk); }
    };
    let direct = null;                               // a trip that starts and ends on one road, forwards
    if (!pts) push(0, [1, hub, sNode, 0], null, null);
    else for (const s of pts.S) {
      const c = cost(hub, s.k), w = wt(hub, s.k), ac = s.d / v;
      push(acc(s.d) + (1 - s.f) * w, [0, hub, s.k, 0], null, {k: s.k, m: hub, c: (1 - s.f) * c, part: [s.f, 1], ac, cand: [s]});
      const t = pts.T.get(s.k);
      if (t && s.f <= t.f) { const tot = acc(s.d) + (t.f - s.f) * w + acc(t.d);
        if (!direct || tot < direct.tot) direct = {tot, steps: [{k: s.k, m: hub, c: (t.f - s.f) * c, part: [s.f, t.f], ac: ac + t.d / v, cand: [s, t]}]}; }
    }
    let goal = null;
    while (h.a.length) {
      const [d, kk] = h.pop(); if (d > dist.get(kk)) continue;
      if (kk === END) { goal = kk; break; }
      const s = state.get(kk), [kind, m, id, p] = s, node = kind === 0 ? D.tgt[id] : id;
      if (!pts && node === tNode && m === hub) { goal = kk; break; }
      const onto = (k) => {                           // take the road k; maybe stop part-way along it
        const c = cost(m, k), w = wt(m, k);
        push(d + w, [0, m, k, p], kk, {k, m, c, part: [0, 1], ac: 0});
        const t = pts && m === hub && pts.T.get(k);
        if (t) push(d + t.f * w + acc(t.d), null, kk, {k, m, c: t.f * c, part: [0, t.f], ac: t.d / v, cand: [t]});
      };
      if (kind === 0) { const g = G[D.modes[m]]; for (const k of g.next[g.pos.get(id)]) onto(k); }
      else for (const k of out.get(m + ":" + node) || []) onto(k);
      for (const [tm, c] of tadj.get(m + ":" + node) || []) {
        if (!allowed.has(tm)) continue;
        let np = p;
        if (m === hub && tm !== hub) { if (p !== 0) continue; np = 1; }
        else if (m !== hub && tm === hub) { if (p !== 1) continue; np = 2; }
        push(d + trW(c), [1, tm, node, np], kk, {tr: true, c});
      }
    }
    let steps;
    if (direct && (goal === null || direct.tot <= dist.get(goal))) steps = direct.steps;
    else if (goal === null) return null;
    else { steps = []; for (let s = goal; ;) { const [ps, step] = prev.get(s); if (step) steps.push(step); if (ps === null) break; s = ps; } steps.reverse(); }
    const legs = []; let transfers = 0, trTime = 0, acS = 0, cands = [];
    for (const st of steps) {
      if (st.tr) { transfers++; trTime += st.c; continue; }
      const mode = D.modes[st.m], last = legs[legs.length - 1], share = st.part[1] - st.part[0];
      if (!last || last.mode !== mode) legs.push({mode, edges: [], parts: [], time: 0, len: 0});
      const leg = legs[legs.length - 1]; leg.edges.push(st.k); leg.parts.push(st.part);
      leg.time += st.c; leg.len += D.len[st.k] * share; acS += st.ac;
      if (st.cand) cands = cands.concat(st.cand);
    }
    let time = trTime + acS, len = 0; for (const l of legs) { time += l.time; len += l.len; }
    return {time, len, legs, transfers, accessS: acS, ends: cands};
  }

  // ---- the page ------------------------------------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  // One mode, or walk + drive (with the mm tables): what route() / route_multimodal() support today.
  const CHOICES = ["walking", "cycling", "driving"].filter((m) => D.modes.includes(m)).map((m) => ({label: LABEL[m], modes: [m]}));
  if (MM && D.modes.includes("driving")) CHOICES.push({label: "Walk + drive", modes: ["walking", "driving"]});
  const NO_MM = !MM && D.modes.includes("walking") && D.modes.includes("driving")
    ? "Walk + drive needs the db's multimodal tables: run `duckosm multimodal` on it." : "";
  function ticked() { return CHOICES[+$("rm-mode").value].modes; }
  function fmtTime(s) { s = Math.round(s); return s < 60 ? s + " s" : Math.floor(s / 60) + " min " + (s % 60) + " s"; }
  function fmtLen(m) { return m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(1) + " km"; }
  function inMode(mode) { return (k) => G[mode].pos.has(k); }

  // ---- snapping a marker to a road: the nearest in the map's data, not among the roads drawn on
  // screen, so it works at any zoom and with the other marker off screen ------------------------
  const CELL = 0.002;                                  // grid cell, degrees (~200 m)
  let GEO = null, GRID = null, KX = 1;
  function buildIndex() {
    const d = map.getSource("roads")._data, fs = (d.geojson || d).features;  // roadstyle's inline source (the planner never tiles); MapLibre 5 keeps it in `_data.geojson`
    GEO = new Array(D.n); GRID = new Map();
    KX = Math.cos(fs[0].geometry.coordinates[0][1] * Math.PI / 180);
    for (const f of fs) {
      const k = AT.get(String(f.properties.edge_id)), c = f.geometry.coordinates;
      if (k === undefined) continue;
      GEO[k] = c;
      for (let i = 1; i < c.length; i++) {
        const [xa, ya] = c[i - 1], [xb, yb] = c[i];
        for (let x = Math.floor(Math.min(xa, xb) / CELL); x <= Math.floor(Math.max(xa, xb) / CELL); x++)
          for (let y = Math.floor(Math.min(ya, yb) / CELL); y <= Math.floor(Math.max(ya, yb) / CELL); y++) {
            const key = x + "," + y; if (!GRID.has(key)) GRID.set(key, new Set()); GRID.get(key).add(k);
          }
      }
    }
  }
  function segM(p, a, b) {                             // metres from p to segment ab (local flat frame)
    const ax = (a[0] - p[0]) * KX, ay = a[1] - p[1], dx = (b[0] - a[0]) * KX, dy = b[1] - a[1], L = dx * dx + dy * dy;
    const t = L ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L)) : 0;
    return Math.hypot(ax + t * dx, ay + t * dy) * 111320;
  }
  // ---- a point joins the network (duckOSM's route_points): every road of the mode within the
  // radius, each with its nearest point: k, fraction along it (by length), metres off the road
  const M = 111320;
  function project(c, p, kx) {
    let best = Infinity, at = 0, acc = 0, rp = c[0];
    for (let i = 1; i < c.length; i++) {
      const ax = (c[i - 1][0] - p[0]) * kx * M, ay = (c[i - 1][1] - p[1]) * M;
      const dx = (c[i][0] - c[i - 1][0]) * kx * M, dy = (c[i][1] - c[i - 1][1]) * M, L2 = dx * dx + dy * dy, L = Math.sqrt(L2);
      const t = L2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L2)) : 0, d = Math.hypot(ax + t * dx, ay + t * dy);
      if (d < best) { best = d; at = acc + t * L; rp = [c[i - 1][0] + t * (c[i][0] - c[i - 1][0]), c[i - 1][1] + t * (c[i][1] - c[i - 1][1])]; }
      acc += L;
    }
    return {d: best, f: acc ? at / acc : 0, rp};
  }
  function radius() { return Math.max(0, +$("rm-radius").value || 0); }
  function speed() { return Math.max(0.1, +$("rm-speed").value || 4.5) / 3.6; }
  // the straight walk p -> rp may not cross another road: a road of the mode, or any road for cars
  // (Kaveh: "it can't jump from roads"); one met within TOUCH m of rp only touches it (a junction)
  const TOUCH = 0.5;
  function crosses(p, rp, blockers, kx) {
    const L = (q) => [(q[0] - p[0]) * kx * M, (q[1] - p[1]) * M], B = L(rp), far = (x, y) => Math.hypot(x - B[0], y - B[1]) > TOUCH;
    const cr = (ax, ay, bx, by) => ax * by - ay * bx;
    for (const k of blockers) {
      const c = GEO[k];
      for (let i = 1; i < c.length; i++) {
        const C = L(c[i - 1]), D = L(c[i]), ex = D[0] - C[0], ey = D[1] - C[1], den = cr(B[0], B[1], ex, ey);
        if (Math.abs(den) < 1e-9) {                     // parallel: overlapping on the walk's line?
          if (Math.abs(cr(C[0], C[1], B[0], B[1])) > 1e-6) continue;
          const BB = B[0] * B[0] + B[1] * B[1];
          for (const P of [C, D]) { const t = BB ? (P[0] * B[0] + P[1] * B[1]) / BB : 0;
            if (t >= 0 && t <= 1 && far(P[0], P[1])) return true; }
          continue;
        }
        const t = cr(C[0], C[1], ex, ey) / den, u = cr(C[0], C[1], B[0], B[1]) / den;
        if (t >= 0 && t <= 1 && u >= 0 && u <= 1 && far(t * B[0], t * B[1])) return true;
      }
    }
    return false;
  }
  function cands(p, ok) {
    const R = radius(), kx = Math.cos(p[1] * Math.PI / 180), cx = Math.floor(p[0] / CELL), cy = Math.floor(p[1] / CELL);
    const ring = Math.ceil(R / (CELL * M * kx)) + 1, seen = new Set(), near = [], out = [];
    for (let x = cx - ring; x <= cx + ring; x++) for (let y = cy - ring; y <= cy + ring; y++)
      for (const k of GRID.get(x + "," + y) || []) if (!seen.has(k)) { seen.add(k); near.push(k); }
    const car = G.driving ? (k) => G.driving.pos.has(k) : () => false;
    const blockers = near.filter((k) => ok(k) || car(k));
    for (const k of near) {
      if (!ok(k)) continue;
      const q = project(GEO[k], p, kx);
      if (q.d <= R && !crosses(p, q.rp, blockers, kx)) out.push({k, f: q.f, d: q.d, rp: q.rp});
    }
    return out;
  }

  // ---- one mode between two points, as route_points: a label is the cost at the END of an edge
  // (a start edge: its part from the point); the start and end edges count only their part
  function routePts(mode, S, T, weight, v) {
    const g = G[mode], W = weight === "length" ? g.len : g.cost, w = (k) => W[g.pos.get(k)];
    const acc = (c) => weight === "length" ? c.d : c.d / v, Tby = new Map(T.map((c) => [c.k, c]));
    let best = null;
    for (const s of S) { const t = Tby.get(s.k);            // start and end on one edge, forward
      if (t && s.f <= t.f) { const tot = acc(s) + (t.f - s.f) * w(s.k) + acc(t); if (!best || tot < best.total) best = {total: tot, s, t}; } }
    const lab = new Map(), prev = new Map(), startOf = new Map(), h = new Heap();
    for (const s of S) { const d = acc(s) + (1 - s.f) * w(s.k);
      if (d < (lab.has(s.k) ? lab.get(s.k) : Infinity)) { lab.set(s.k, d); prev.set(s.k, null); startOf.set(s.k, s); h.push(d, s.k); } }
    const arrive = new Map(), from = new Map();
    while (h.a.length) {
      const [d, e] = h.pop(); if (d > lab.get(e)) continue; if (best && d >= best.total) break;
      for (const n of g.next[g.pos.get(e)]) {
        const t = Tby.get(n);
        if (t && d < (arrive.has(n) ? arrive.get(n) : Infinity)) { arrive.set(n, d); from.set(n, e);
          const tot = d + t.f * w(n) + acc(t); if (!best || tot < best.total) best = {total: tot, last: n}; }
        const nd = d + w(n);
        if (nd < (lab.has(n) ? lab.get(n) : Infinity)) { lab.set(n, nd); prev.set(n, e); h.push(nd, n); }
      }
    }
    if (!best) return null;
    let path, parts, s, t;
    if (best.s) { s = best.s; t = best.t; path = [s.k]; parts = [[s.f, t.f]]; }
    else {
      path = [best.last]; for (let e = from.get(best.last); e !== null && e !== undefined; e = prev.get(e)) path.push(e);
      path.reverse(); s = startOf.get(path[0]); t = Tby.get(best.last);
      parts = path.map((_, i) => [i === 0 ? s.f : 0, i === path.length - 1 ? t.f : 1]);
    }
    let time = 0, len = 0;
    path.forEach((k, i) => { const sh = parts[i][1] - parts[i][0], j = g.pos.get(k); time += g.cost[j] * sh; len += g.len[j] * sh; });
    const leg = {mode, edges: path, parts, time, len};
    return {time: time + (s.d + t.d) / v, len: len + s.d + t.d, legs: [leg], transfers: 0, start: s, end: t};
  }

  // ---- walk + drive between two points, as route_multimodal_points: the trip starts and ends
  // walking, on the roads within the radius, with a direct walk when both points are on one road
  function routeMultiPts(S, T, allowed, v, weight) {
    const r = routeMulti(null, null, allowed, {S, T: new Map(T.map((t) => [t.k, t]))}, v, weight);
    if (!r) return null;
    r.start = r.ends[0]; r.end = r.ends[r.ends.length - 1];
    r.len += r.start.d + r.end.d;
    return r;
  }

  // ---- drawing: the route's exact line by leg (cut where it starts and ends), the walks to the
  // road dashed, and each marker's radius (red when no road is inside)
  function cut(c, f0, f1) {
    if (f0 <= 0 && f1 >= 1) return c;
    const kx = Math.cos(c[0][1] * Math.PI / 180), seg = [];
    let tot = 0; for (let i = 1; i < c.length; i++) { const L = Math.hypot((c[i][0] - c[i - 1][0]) * kx, c[i][1] - c[i - 1][1]); seg.push(L); tot += L; }
    const at = (f) => { let a = f * tot; for (let i = 1; i < c.length; i++) { if (a <= seg[i - 1] || i === c.length - 1) { const t = seg[i - 1] ? Math.min(1, a / seg[i - 1]) : 0;
      return [c[i - 1][0] + t * (c[i][0] - c[i - 1][0]), c[i - 1][1] + t * (c[i][1] - c[i - 1][1])]; } a -= seg[i - 1]; } return c[c.length - 1]; };
    const out = [at(f0)]; let a = 0;
    for (let i = 1; i < c.length; i++) { a += seg[i - 1]; if (a > f0 * tot && a < f1 * tot) out.push(c[i]); }
    out.push(at(f1)); return out;
  }
  function circle(p, r) {
    const kx = Math.cos(p[1] * Math.PI / 180), ring = [];
    for (let i = 0; i <= 48; i++) { const a = i / 48 * 2 * Math.PI; ring.push([p[0] + r * Math.cos(a) / (M * kx), p[1] + r * Math.sin(a) / M]); }
    return ring;
  }
  function setData(id, features) { const src = map.getSource(id); if (src) src.setData({type: "FeatureCollection", features}); }
  function drawLayers() {
    if (map.getSource("rm-route")) return;
    for (const id of ["rm-radius", "rm-access", "rm-route"]) map.addSource(id, {type: "geojson", data: {type: "FeatureCollection", features: []}});
    map.addLayer({id: "rm-radius-fill", type: "fill", source: "rm-radius",
      paint: {"fill-color": ["case", ["get", "empty"], "#dc2626", "#0f9488"], "fill-opacity": 0.08}});
    map.addLayer({id: "rm-radius-line", type: "line", source: "rm-radius",
      paint: {"line-color": ["case", ["get", "empty"], "#dc2626", "#0f9488"], "line-width": 1.5, "line-dasharray": [3, 2]}});
    map.addLayer({id: "rm-route-casing", type: "line", source: "rm-route", layout: {"line-cap": "round", "line-join": "round"},
      paint: {"line-color": "#ffffff", "line-width": ["interpolate", ["linear"], ["zoom"], 12, 5, 18, 12]}});
    map.addLayer({id: "rm-route", type: "line", source: "rm-route", layout: {"line-cap": "round", "line-join": "round"},
      paint: {"line-color": ["get", "color"], "line-width": ["interpolate", ["linear"], ["zoom"], 12, 3, 18, 8]}});
    map.addLayer({id: "rm-access", type: "line", source: "rm-access",
      paint: {"line-color": "#374151", "line-width": 2.5, "line-dasharray": [1.5, 1.5]}});
  }
  function drawRadius(emptyA, emptyB) {
    const R = radius(), f = (m, empty) => m ? [{type: "Feature", properties: {empty: !!empty},
      geometry: {type: "Polygon", coordinates: [circle([m.getLngLat().lng, m.getLngLat().lat], R)]}}] : [];
    setData("rm-radius", f(markers.A, emptyA).concat(f(markers.B, emptyB)));
  }
  function paint(res) {
    rsColor(null);
    if (!res) { setData("rm-route", []); setData("rm-access", []); return; }
    const lines = [];
    for (const l of res.legs) l.edges.forEach((k, i) => lines.push({type: "Feature", properties: {color: COLORS[l.mode]},
      geometry: {type: "LineString", coordinates: cut(GEO[k], l.parts[i][0], l.parts[i][1])}}));
    setData("rm-route", lines);
    const walk = (m, c) => ({type: "Feature", properties: {}, geometry: {type: "LineString",
      coordinates: [[m.getLngLat().lng, m.getLngLat().lat], c.rp]}});
    setData("rm-access", [walk(markers.A, res.start), walk(markers.B, res.end)]);
  }

  // ---- directions: route-guidance's maneuver rules (OSRM model), ported --------------------------
  const RB = new Set(D.rb), OUT = {}, R_EARTH = 6371000, RAD = Math.PI / 180;
  const COMPASS = ["north", "northeast", "east", "southeast", "south", "southwest", "west", "northwest"];
  function outOf(mode) {                               // mode -> node -> the edges leaving it
    if (!OUT[mode]) { const m = new Map(); for (const k of G[mode].k) { const n = D.src[k]; if (!m.has(n)) m.set(n, []); m.get(n).push(k); } OUT[mode] = m; }
    return OUT[mode];
  }
  function hav(a, b) {
    const dl = (b[1] - a[1]) * RAD, dn = (b[0] - a[0]) * RAD;
    const h = Math.sin(dl / 2) ** 2 + Math.cos(a[1] * RAD) * Math.cos(b[1] * RAD) * Math.sin(dn / 2) ** 2;
    return 2 * R_EARTH * Math.asin(Math.sqrt(h));
  }
  function brg(a, b) {
    const f1 = a[1] * RAD, f2 = b[1] * RAD, dn = (b[0] - a[0]) * RAD;
    const y = Math.sin(dn) * Math.cos(f2), x = Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dn);
    return (Math.atan2(y, x) / RAD + 360) % 360;
  }
  function headAt(c, fromStart) {                      // heading over the first / last 18 m of a line
    let acc = 0;
    if (fromStart) { for (let i = 1; i < c.length; i++) { acc += hav(c[i - 1], c[i]); if (acc >= 18 || i === c.length - 1) return brg(c[0], c[i]); } }
    else { for (let i = c.length - 2; i >= 0; i--) { acc += hav(c[i], c[i + 1]); if (acc >= 18 || i === 0) return brg(c[i], c[c.length - 1]); } }
    return 0;
  }
  const turn = (b0, b1) => ((b1 - b0 + 540) % 360) - 180;    // + = right
  function modifier(a) {
    const x = Math.abs(a), side = a > 0 ? "right" : "left";
    return x < 20 ? "straight" : x >= 170 ? "uturn" : x < 45 ? "slight " + side : x < 135 ? side : "sharp " + side;
  }
  const isTurn = (m) => ["left", "right", "uturn"].includes(m) || m.startsWith("sharp");
  function directions(legs) {
    const E = legs.flatMap((l) => l.edges.map((k, i) => ({k, mode: l.mode, c: GEO[k], name: D.name[k], hw: D.hw[k],
      len: D.len[k] * (l.parts ? l.parts[i][1] - l.parts[i][0] : 1), rb: RB.has(k), out: outOf(l.mode).get(D.src[k]) || []})));
    if (!E.length) return [];
    const same = (a, b) => a.name || b.name ? a.name === b.name : a.hw === b.hw;
    const step = (type, mod, e) => ({type, mod, name: e.name, mode: e.mode, at: e.c[0], len: 0});
    const steps = []; let cur = null, rb = null, outB = 0;
    for (let i = 0; i < E.length; i++) {
      const e = E[i], eIn = headAt(e.c, true), eOut = headAt(e.c, false);
      if (e.rb) {                                      // a roundabout: one "take the Nth exit"
        if (!rb) { if (cur) steps.push(cur); cur = null; rb = step("roundabout", "", e); rb.name = ""; rb.exit = 0; }
        rb.exit++; rb.len += e.len; outB = eOut; continue;
      }
      if (rb) { rb.name = e.name; cur = rb; rb = null; cur.len += e.len; outB = eOut; continue; }
      if (!cur) cur = step("depart", COMPASS[Math.floor(((eIn + 22.5) % 360) / 45)], e);
      else {
        const prev = E[i - 1], mod = modifier(turn(outB, eIn)), sharp = mod === "uturn" || mod.startsWith("sharp");
        const junction = e.out.length >= 3, named = !same(prev, e) && !!e.name;
        let fork = null;                               // 2+ ways forward: keep left / right
        if (junction && !isTurn(mod)) {
          const mine = turn(outB, eIn);
          const sibs = e.out.map((k) => headAt(GEO[k], true)).filter((b) => Math.abs(turn(eIn, b)) > 8).map((b) => turn(outB, b));
          if (Math.abs(mine) >= 12 && Math.abs(mine) < 50 && !sibs.some((t) => Math.abs(t) < 12) &&
              sibs.some((t) => Math.abs(t) < 50 && (t < 0) !== (mine < 0))) fork = mine < 0 ? "left" : "right";
        }
        const next = e.mode !== prev.mode ? step("mode", mod, e) : sharp || (junction && isTurn(mod)) ? step("turn", mod, e)
          : fork ? step("fork", fork, e) : named ? step("new name", mod, e) : null;
        if (next) { steps.push(cur); cur = next; }
      }
      cur.len += e.len; outB = eOut;
    }
    if (rb) steps.push(rb); else if (cur) steps.push(cur);
    const last = E[E.length - 1].c;
    steps.push({type: "arrive", mod: "", name: "", at: last[last.length - 1], len: 0});
    return steps;
  }
  const VERB = {walking: "on foot", cycling: "by bike", driving: "by car"};
  function say(s) {
    const onto = s.name ? " onto " + s.name : "", on = s.name ? " on " + s.name : "";
    const nth = (n) => n + ((n % 100 >= 11 && n % 100 <= 13) ? "th" : ({1: "st", 2: "nd", 3: "rd"}[n % 10] || "th"));
    switch (s.type) {
      case "depart": return (s.mode === "walking" ? "Walk " : "Head ") + s.mod + on;
      case "turn": return s.mod === "uturn" ? "Make a U-turn" + onto : "Turn " + s.mod + onto;
      case "fork": return "Keep " + s.mod + " at the fork" + onto;
      case "new name": return "Continue" + onto;
      case "roundabout": return "At the roundabout, take the " + nth(s.exit) + " exit" + onto;
      case "mode": return "Continue " + (VERB[s.mode] || "") + onto;
      case "arrive": return "Arrive at your destination";
    }
    return s.type;
  }

  const ICON = {"slight left": "\u2196", "slight right": "\u2197", left: "\u21B0", "sharp left": "\u21B0", right: "\u21B1",
    "sharp right": "\u21B1", uturn: "\u21B6", straight: "\u2191"};
  const ARROW = {north: "\u2191", northeast: "\u2197", east: "\u2192", southeast: "\u2198", south: "\u2193",
    southwest: "\u2199", west: "\u2190", northwest: "\u2196"};
  function icon(s) {
    switch (s.type) {
      case "depart": return ARROW[s.mod] || "\u2191";
      case "roundabout": return "\u27F3";
      case "mode": return "\u21C4";
      case "arrive": return "\u2691";
      case "fork": return s.mod === "left" ? "\u2196" : "\u2197";
    }
    return ICON[s.mod] || "\u2191";
  }
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  const roadName = (c) => c ? esc(D.name[c.k] || D.hw[c.k] || "a road") : "\u2026";
  function ends(res) { $("rm-from").innerHTML = roadName(res && res.start); $("rm-to").innerHTML = roadName(res && res.end); }

  function show(res, multi) {
    const out = $("rm-result");
    ends(res); $("rm-edges").innerHTML = "";
    if (!res) { out.innerHTML = '<div class="rm-msg">No route between these points with these modes.</div>'; paint(null); return; }
    const v = speed(), off = res.start.d + res.end.d;
    const legs = res.legs.filter((l) => l.len >= 0.5), tot = legs.reduce((a, l) => a + l.time, 0) || 1;
    const col = (m) => `var(--${{walking: "walk", driving: "drive", cycling: "cycle"}[m]})`;
    const bar = legs.map((l) => `<i style="flex:${Math.max(l.time, tot * 0.012)};background:${col(l.mode)}"></i>`).join("");
    let key = legs.map((l) => `<span style="--c:${col(l.mode)}">${LABEL[l.mode]} ${fmtLen(l.len)} \u00B7 ${fmtTime(l.time)}</span>`).join("");
    if (off >= 1) key += `<span style="--c:var(--rest)">Off-road walk ${fmtLen(off)} \u00B7 ${fmtTime(off / v)}</span>`;
    let h = `<div class="rm-sum"><div class="rm-big">${fmtTime(res.time)}<span>${fmtLen(res.len)}</span></div>` +
      `<div class="rm-bar">${bar}</div><div class="rm-legend">${key}</div>` +
      (multi && res.transfers ? `<span class="rm-chip">${res.transfers} change${res.transfers > 1 ? "s" : ""} of mode</span>` : "") + "</div>";
    const steps = directions(res.legs), lastMode = res.legs[res.legs.length - 1].mode;
    h += '<ol class="rm-steps">' + steps.map((st, i) => `<li data-i="${i}"><span class="rm-ic" style="--c:${col(st.mode || lastMode)}">${icon(st)}</span>` +
         `<div>${say(st)}` + (st.len ? `<span class="rm-dist">${fmtLen(st.len)}</span>` : "") + "</div></li>").join("") + "</ol>";
    out.innerHTML = h;
    const ks = res.legs.flatMap((l) => l.edges), ps = rsGetProps(ks.map((k) => fid[k]));
    $("rm-edges").innerHTML = `<details class="rm-edges"><summary>${ks.length} edges (edge_id)</summary><ol>` +
         ps.map((p) => `<li><code>${p.edge_id}</code></li>`).join("") + "</ol></details>";
    for (const li of out.querySelectorAll(".rm-steps li"))       // a step -> the map at that maneuver
      li.addEventListener("click", () => map.flyTo({center: steps[+li.dataset.i].at, zoom: Math.max(map.getZoom(), 17)}));
    window.rmSteps = steps.map(say);                              // for tests and scripts
    paint(res);
  }

  function update() {
    const modes = ticked(), multi = modes.length > 1;
    $("rm-note").textContent = multi ? "Walk + drive: the car can be taken at any junction (60 s per change)." : NO_MM;
    if (!markers.A || !markers.B) return;
    const ok = inMode(multi ? "walking" : modes[0]), at = (m) => [m.getLngLat().lng, m.getLngLat().lat];
    const S = cands(at(markers.A), ok), T = cands(at(markers.B), ok);
    drawRadius(!S.length, !T.length);
    if (!S.length || !T.length) {
      const which = !S.length && !T.length ? "the start and the end" : !S.length ? "the start" : "the end";
      ends(null);
      $("rm-result").innerHTML = `<div class="rm-msg">No ${multi ? "walkable road" : "road of this mode"} within ${radius()} m of ${which}: ` +
        "move the pin or raise the off-road distance.</div>";
      window.rmLast = {modes, error: "no road"}; paint(null); return;
    }
    const v = speed(), w = document.querySelector('input[name="rm-w"]:checked').value;
    const res = multi ? routeMultiPts(S, T, new Set(modes.map((m) => D.modes.indexOf(m))), v, w) : routePts(modes[0], S, T, w, v);
    window.rmLast = {modes, res};                         // for tests and scripts
    show(res, multi);
  }

  function setMarker(which, lngLat) {
    if (!markers[which]) {
      const el = document.createElement("div"); el.className = "rm-mk"; el.title = which === "A" ? "Start" : "End";
      el.style.setProperty("--c", which === "A" ? "#7c3aed" : "#d97706");       // not the walk / drive colours of the route
      el.innerHTML = `<div class="rm-mkb"><span>${which}</span></div>`;
      markers[which] = new maplibregl.Marker({element: el, anchor: "bottom", draggable: true})
        .setLngLat(lngLat).addTo(map);
      markers[which].on("dragend", update);
      markers[which].on("drag", () => drawRadius());           // the radius follows the marker
    } else markers[which].setLngLat(lngLat);
  }

  function init() {
    const panel = $("rm-panel"), themeBtn = $("rm-theme");        // light is the default; the choice is kept in this browser
    const setTheme = (t) => { panel.dataset.theme = t; themeBtn.textContent = t === "dark" ? "\u2600" : "\u263E";
      try { localStorage.setItem("rm-theme", t); } catch (e) {} };
    let saved = "light"; try { saved = localStorage.getItem("rm-theme") === "dark" ? "dark" : "light"; } catch (e) {}
    setTheme(saved);
    themeBtn.addEventListener("click", () => setTheme(panel.dataset.theme === "dark" ? "light" : "dark"));
    const ids = rsQuery(() => true), props = rsGetProps(ids);
    fid = new Array(D.n);
    for (let i = 0; i < ids.length; i++) { const k = AT.get(String(props[i].edge_id)); if (k !== undefined) fid[k] = ids[i]; }
    buildIndex();
    $("rm-mode").innerHTML = CHOICES.map((c, i) => `<option value="${i}">${c.label}</option>`).join("");
    const first = CHOICES.findIndex((c) => c.modes.join() === (D.first || []).join());    // route-map -m
    if (first >= 0) $("rm-mode").value = String(first);
    const modes = $("rm-modes"), sync = () => { for (const b of modes.children) b.classList.toggle("on", b.value === $("rm-mode").value); };
    modes.innerHTML = CHOICES.map((c, i) => `<button type="button" value="${i}"${c.modes.length > 1 ? ' class="rm-wide"' : ""}>${c.label}</button>`).join("");
    modes.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { $("rm-mode").value = b.value; sync(); update(); } });
    $("rm-mode").addEventListener("change", () => { sync(); update(); });
    sync();
    $("rm-weight").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      for (const x of $("rm-weight").querySelectorAll("button")) x.classList.toggle("on", x === b);
      document.querySelector(`input[name="rm-w"][value="${b.dataset.w}"]`).checked = true; update();
    });
    $("rm-swap").addEventListener("click", () => {
      const a = markers.A.getLngLat(), b = markers.B.getLngLat(); markers.A.setLngLat(b); markers.B.setLngLat(a); update();
    });
    for (const id of ["rm-radius", "rm-speed"]) $(id).addEventListener("input", update);
    drawLayers();
    // A click on a road (roadstyle's popup): its edge_id is copied and kept in the panel.
    document.addEventListener("rs:select", (e) => {
      const id = !e.detail.overlay && e.detail.properties && e.detail.properties.edge_id;
      if (!id) return;
      $("rm-clicked").innerHTML = `Clicked road: <code>${id}</code> <span id="rm-copied"></span>`; $("rm-more").open = true;
      if (navigator.clipboard) navigator.clipboard.writeText(String(id)).then(() => { $("rm-copied").textContent = "(copied)"; }, () => {});
    });
    window.rmRoute = function (a, b) { setMarker("A", a); setMarker("B", b); update(); };  // for scripted use
    rmRoute(D.start, D.end);              // opens with a route; drag the markers to change it
  }

  (function wait() {
    try { if (window.map && window.rsQuery && map.isStyleLoaded() && rsQuery(() => true).length) return init(); } catch (e) {}
    setTimeout(wait, 200);
  })();
})();
</script>
